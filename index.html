<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="東吳英檢">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>東吳英檢練習 App V1.1｜學習強化版</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d9deea;--accent:#1d4ed8;--soft:#eef4ff;--ok:#177245;--okbg:#ecfdf3;--bad:#b42318;--badbg:#fff1f0;--study:#5b3bb5;--studybg:#f6f2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",Arial,sans-serif}
.app{max-width:920px;margin:auto;padding:18px 14px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
h1{font-size:25px;margin:0 0 4px} .muted{color:var(--muted)} .small{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px}
.stat{padding:11px;text-align:center} .stat b{display:block;font-size:19px;margin-top:2px}
.panel{padding:17px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{display:inline-block;border-radius:999px;background:var(--soft);padding:5px 9px;font-size:13px}
.passage{margin:14px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fafbfc;line-height:1.7;white-space:pre-wrap;max-height:340px;overflow:auto}
.question{font-size:20px;font-weight:700;line-height:1.55;margin:16px 0 12px}
.options{display:grid;gap:9px}
.option{min-height:48px;width:100%;padding:11px 13px;text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font-size:16px;line-height:1.45;cursor:pointer}
.option:hover{background:#f8fafc} .option:disabled{cursor:default;opacity:1}
.option.correct{border-color:#73c69b;background:var(--okbg)} .option.wrong{border-color:#f0a7a0;background:var(--badbg)}
.feedback{display:none;margin-top:13px;padding:12px;border-radius:11px;line-height:1.55;background:#f8fafc}
.feedback.ok{background:var(--okbg);color:var(--ok)} .feedback.bad{background:var(--badbg);color:var(--bad)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
button.ctrl{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 14px;font-size:15px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff} button:disabled{opacity:.45;cursor:not-allowed}
.finish{display:none;margin-top:14px} .finish h2{margin-top:0}
.bar{height:7px;background:#e9edf5;border-radius:10px;overflow:hidden;margin-top:9px} .bar>div{height:100%;background:var(--accent);width:0}
.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;line-height:1.6}

.study{display:none;margin-top:13px;border:1px solid #d9cdf9;border-radius:12px;background:var(--studybg);padding:14px;line-height:1.65}.study h3{margin:0 0 8px;font-size:16px;color:var(--study)}.study-row{margin:7px 0}.study-label{font-weight:700;color:var(--study)}
.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.resultitem{border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;background:#fafbfc}.resultitem b{display:block;font-size:18px;margin-top:3px}
.modal{display:none;position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;padding:20px;overflow:auto}.modal.open{display:block}.modal-card{max-width:760px;margin:3vh auto;background:#fff;border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.18)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{margin:0}.close{border:0;background:#f2f4f7;border-radius:9px;padding:8px 11px;cursor:pointer}.wrong-list{display:grid;gap:9px;margin-top:14px}.wrong-card{border:1px solid var(--line);border-radius:11px;padding:11px}.wrong-card b{display:block;margin-bottom:4px}.status-bad{color:var(--bad)}
@media(max-width:620px){.resultgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.app{padding:12px 10px 30px}h1{font-size:22px}.panel{padding:14px}.question{font-size:18px}.option{font-size:16px}}
</style>
</head>
<body>
<main class="app">
<header>
<div><h1>東吳英檢 60 題練習</h1><div class="muted">原題第 51～110 題｜文法＋閱讀｜學習強化版</div></div>
<div class="settings"><label><input id="shuffle" type="checkbox"> 隨機出題</label><label><input id="instant" type="checkbox" checked> 立即公布答案</label><label><input id="showStudy" type="checkbox" checked> 顯示中文解說</label></div>
</header>

<section class="stats">
<div class="stat"><span class="muted small">進度</span><b id="progress">1 / 60</b></div>
<div class="stat"><span class="muted small">答對</span><b id="correctCount">0</b></div>
<div class="stat"><span class="muted small">正確率</span><b id="accuracy">0%</b></div>
</section>

<section class="panel">
<div class="topline"><div><span id="kind" class="badge">文法</span> <span id="sourceNo" class="muted small">原題 51</span></div><span id="saved" class="muted small"></span></div>
<div class="bar"><div id="barFill"></div></div>
<div id="passage" class="passage" style="display:none"></div>
<div id="question" class="question"></div>
<div id="options" class="options"></div>
<div id="feedback" class="feedback" aria-live="polite"></div>
<div id="study" class="study" aria-live="polite"></div>
<div class="actions">
<button id="nextBtn" class="ctrl primary" disabled>下一題</button>
<button id="wrongBtn" class="ctrl">錯題重練</button>
<button id="wrongBookBtn" class="ctrl">錯題本</button>
<button id="restartBtn" class="ctrl">重新開始</button>
</div>
</section>

<section id="finish" class="panel finish">
<h2>本次練習完成</h2><p id="summary"></p><div id="finishStats" class="resultgrid"></div>
<div class="actions"><button id="againBtn" class="ctrl primary">再練一次</button><button id="reviewWrongBtn" class="ctrl">只練錯題</button></div>
</section>


<section class="panel" style="margin-top:14px">
  <div class="topline">
    <div>
      <strong>安裝到手機</strong>
      <div class="muted small" style="margin-top:4px">
        iPhone / iPad：用 Safari 開啟後，按「分享」→「加入主畫面」。
        Android / Chrome：瀏覽器通常會提供「安裝應用程式」。
      </div>
    </div>
    <span class="badge">PWA V1.1</span>
  </div>
</section>


<div id="wrongModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="wrongTitle"><div class="modal-card"><div class="modal-head"><h2 id="wrongTitle">錯題本</h2><button id="closeWrong" class="close">關閉</button></div><div class="muted small" style="margin-top:6px">錯題會持續保留；答對後仍可查看曾經錯過的題目。</div><div id="wrongList" class="wrong-list"></div></div></div>
<footer>東吳英檢練習 App V1.1｜新增中文題意、答案解析、文章重點、錯題本與分類統計。</footer>
</main>

<script>
const DATA=[{"n":1,"original":51,"type":"grammar","q":"Little boys who play truant don't go to school _____ .","options":["because they are ill","because they have left","because they are not allowed to","on purpose"],"answer":3,"passage":null,"zh":"逃學的小男孩不去上學，是因為＿＿＿。","explanation":"play truant 是「逃學、翹課」，本身就含有故意不上學的意思，因此選 on purpose（故意地）。","passageZh":""},{"n":2,"original":52,"type":"grammar","q":"“Where have you been hiding?” she asked. She asked me where _____ hiding.","options":["I had been","had I been","had been I","had I being"],"answer":0,"passage":null,"zh":"「你一直躲在哪裡？」她問。改為間接問句：她問我一直躲在哪裡。","explanation":"直接問句改成間接問句後要用陳述句語序；主句 asked 是過去式，原本現在完成進行式要回溯為過去完成進行概念，因此選 I had been。","passageZh":""},{"n":3,"original":53,"type":"grammar","q":"I am used to traveling by air. I am _____ to it.","options":["accustomed","habitual","customary","inhabited"],"answer":0,"passage":null,"zh":"我習慣搭飛機旅行。換句話說，我已經＿＿＿這件事。","explanation":"be used to + 名詞／V-ing 表示「習慣於」；accustomed to 與 used to 在此同義。","passageZh":""},{"n":4,"original":54,"type":"grammar","q":"He saluted as they passed. He saluted ______.","options":["while they had passed","while they were passing","though they were passing","because they had passed"],"answer":1,"passage":null,"zh":"他們經過時，他敬禮。哪一個改寫意思相同？","explanation":"as 在此表示「當……時」，等同 while they were passing，強調動作進行中的同時。","passageZh":""},{"n":5,"original":55,"type":"grammar","q":"Recently it was damaged. She damaged it _____.","options":["late","lastly","lately","finally"],"answer":2,"passage":null,"zh":"最近它被弄壞了。她＿＿＿把它弄壞。","explanation":"recently 與 lately 都可表示「最近」；late 是遲、lastly 是最後一點、finally 是終於。","passageZh":""},{"n":6,"original":56,"type":"grammar","q":"He wanted to measure temperatures. He wanted to _____ them.","options":["count","make","do","take"],"answer":3,"passage":null,"zh":"他想測量溫度，也就是想＿＿＿溫度。","explanation":"英文固定搭配是 take a temperature / take temperatures，表示量體溫／測量溫度。","passageZh":""},{"n":7,"original":57,"type":"grammar","q":"The ______ of finding gold in California attracted a lot of people to settle down there.","options":["prospects","speculations","stakes","provisions"],"answer":0,"passage":null,"zh":"在加州找到黃金的＿＿＿吸引許多人到那裡定居。","explanation":"prospect 可指「可能性、前景」；the prospects of finding gold 即找到黃金的可能性／前景。","passageZh":""},{"n":8,"original":58,"type":"grammar","q":"Lights were blazing. They were _____ .","options":["gleaming","shining","reflecting","being burnt"],"answer":1,"passage":null,"zh":"燈光熊熊／明亮地發光，也就是它們正在＿＿＿。","explanation":"blaze 在燈光語境表示強烈發光，與 shining 最接近。","passageZh":""},{"n":9,"original":59,"type":"grammar","q":"He as taking his savings to the post office. He keeps his savings _____the post office.","options":["to","in","on","into"],"answer":1,"passage":null,"zh":"他把積蓄帶到郵局。他把積蓄存＿＿＿郵局。","explanation":"表示「把錢存在郵局」使用介系詞 in：keep savings in the post office。","passageZh":""},{"n":10,"original":60,"type":"grammar","q":"The girl returned the money. She was very _____.","options":["honourable","honest","honoured","trusting"],"answer":1,"passage":null,"zh":"女孩把錢還回去了。她非常＿＿＿。","explanation":"撿到／拿到錢後歸還，表現的是 honest（誠實）。honourable 偏「可敬的」。","passageZh":""},{"n":11,"original":61,"type":"grammar","q":"The boys had put out the campfire. The fire wasn't _____.","options":["switched on","on fire","on","alight"],"answer":3,"passage":null,"zh":"男孩們已經把營火熄滅。火已經不再＿＿＿。","explanation":"put out the fire 表示把火熄滅；alight 表示「燃燒著的」，not alight 即已熄滅。","passageZh":""},{"n":12,"original":62,"type":"grammar","q":"Byrd now knew he would be able to _____ the South Pole.","options":["arrive at","arrive","reach at","reach in"],"answer":0,"passage":null,"zh":"Byrd現在知道自己能夠＿＿＿南極。","explanation":"arrive 是不及物動詞，到達地點通常用 arrive at；reach 則直接加地點，不能用 reach at。","passageZh":""},{"n":13,"original":63,"type":"grammar","q":"_____ eventually brought to the shore, it was found to be very long.","options":["Been","When","On being","When it was being"],"answer":2,"passage":null,"zh":"＿＿＿最後被帶到岸上時，發現它非常長。","explanation":"On being + 過去分詞表示「在被……時／一被……之後」，符合被帶到岸上的被動語意。","passageZh":""},{"n":14,"original":64,"type":"grammar","q":"Goods were sent from various parts of the world. They came from _____ parts.","options":["mixed","assorted","different","mixed up"],"answer":2,"passage":null,"zh":"貨物從世界各地運來，也就是來自＿＿＿地區。","explanation":"various parts = different parts，表示不同的／各種地區。","passageZh":""},{"n":15,"original":65,"type":"grammar","q":"A gust of wind swept the bed off the roof. The wind blew very _____ .","options":["hard","fast","quickly","soon"],"answer":0,"passage":null,"zh":"一陣強風吹走屋頂上的床。風颳得非常＿＿＿。","explanation":"形容風雨猛烈常用 hard，如 The wind blew hard。fast/quickly 不自然。","passageZh":""},{"n":16,"original":66,"type":"grammar","q":"The American dream does not come to those who fall _______.","options":["sleeping","sleep","asleep","slept"],"answer":2,"passage":null,"zh":"美國夢不會降臨在那些＿＿＿的人身上。","explanation":"fall asleep 是固定搭配，表示「睡著」。","passageZh":""},{"n":17,"original":67,"type":"grammar","q":"Wallis Island is a remote place in the South Pacific. It is _____.","options":["far away","well-known","popular","close to the European continent"],"answer":0,"passage":null,"zh":"Wallis Island是南太平洋一個偏遠地方，也就是它非常＿＿＿。","explanation":"remote 表示偏遠的，最接近 far away。","passageZh":""},{"n":18,"original":68,"type":"grammar","q":"Workers began _____ a number of wooden boxes.","options":["unload","to unloading","unloaded","unloading"],"answer":3,"passage":null,"zh":"工人開始＿＿＿許多木箱。","explanation":"begin 可接 to V 或 V-ing；選項中只有 unloading 文法正確。","passageZh":""},{"n":19,"original":69,"type":"grammar","q":"_____ had it been wrapped up in? A newspaper.","options":["Where","Who","How","What"],"answer":3,"passage":null,"zh":"它是用＿＿＿包起來的？用報紙。","explanation":"詢問「用什麼包裝」用 What：What had it been wrapped up in?","passageZh":""},{"n":20,"original":70,"type":"grammar","q":"Someone had filled the parcel with stones and sand. It was _____stones and sand.","options":["full with","full of","full by","full in"],"answer":1,"passage":null,"zh":"有人在包裹裡裝滿石頭和沙。也就是包裹＿＿＿石頭和沙。","explanation":"be full of 是固定搭配，表示「充滿……」。","passageZh":""},{"n":21,"original":71,"type":"grammar","q":"The money _____ in his room.","options":["was","were","care","has"],"answer":0,"passage":null,"zh":"錢＿＿＿在他的房間裡。","explanation":"money 通常視為不可數名詞，搭配單數動詞 was。","passageZh":""},{"n":22,"original":72,"type":"grammar","q":"He admitted hiding in the box. He _____ it.","options":["announced","described","confessed","declared"],"answer":2,"passage":null,"zh":"他承認躲在箱子裡，也就是他＿＿＿這件事。","explanation":"admit 在此與 confess（承認）最接近。","passageZh":""},{"n":23,"original":73,"type":"grammar","q":"It was covered with coins. There were coins _____it.","options":["in","over","under","all over"],"answer":3,"passage":null,"zh":"它被硬幣覆蓋，也就是硬幣＿＿＿它。","explanation":"all over 表示「遍布、覆蓋在……各處」。","passageZh":""},{"n":24,"original":74,"type":"grammar","q":"She probably stamped out the letters 'SOS' with her _____.","options":["hands","head","feet","knees"],"answer":2,"passage":null,"zh":"她可能用她的＿＿＿踩出「SOS」字樣。","explanation":"stamp out letters 表示踩／踏出字樣，依語境用 feet。","passageZh":""},{"n":25,"original":75,"type":"grammar","q":"She must be at least thirty-five years old. In my opinion she _____.","options":["has","is","can","must"],"answer":1,"passage":null,"zh":"她至少35歲。依我的看法，她＿＿＿35歲。","explanation":"原句 must be 是推測「一定／至少是」；改寫為 In my opinion she is...，空格需 be 動詞 is。","passageZh":""},{"n":26,"original":76,"type":"grammar","q":"How many times did the clock _____ ?","options":["hit","beat","knock","strike"],"answer":3,"passage":null,"zh":"時鐘敲了幾次？","explanation":"鐘「敲響」使用 strike；如 The clock struck twelve。","passageZh":""},{"n":27,"original":77,"type":"grammar","q":"He has just bought a new house. He has been in it _____ a short time.","options":["since","for","about","ago"],"answer":1,"passage":null,"zh":"他剛買新房子。他住進去只有＿＿＿一小段時間。","explanation":"一段持續時間搭配 for；since 後接起點。","passageZh":""},{"n":28,"original":78,"type":"grammar","q":"They hoped to find buried treasure. They hoped they _____ it.","options":["would find","had found","will find","are going to find"],"answer":0,"passage":null,"zh":"他們希望找到埋藏的寶藏，也就是希望他們＿＿＿它。","explanation":"過去式 hoped 後談當時的未來，用 would find。","passageZh":""},{"n":29,"original":79,"type":"grammar","q":"The police _____ Dan's bicycle.","options":["had been finding","had been found","had found","have been finding"],"answer":2,"passage":null,"zh":"警方＿＿＿Dan的腳踏車。","explanation":"題庫答案為 had found，表示在另一過去時間點之前警方已找到腳踏車。","passageZh":""},{"n":30,"original":80,"type":"grammar","q":"The thief _____ the wallet in newspaper.","options":["wound","rolled","wrapped","bound"],"answer":2,"passage":null,"zh":"小偷用報紙＿＿＿錢包。","explanation":"wrap A in B = 用B包住A；wrapped the wallet in newspaper。","passageZh":""},{"n":31,"original":81,"type":"grammar","q":"He set a new world record. He _____ a new record.","options":["did","played","created","found"],"answer":2,"passage":null,"zh":"他創下新的世界紀錄，也就是他＿＿＿一項新紀錄。","explanation":"create a record 可表「創造／創下紀錄」，與 set a record 對應。","passageZh":""},{"n":32,"original":82,"type":"grammar","q":"Nigel Dykes never has anything to do. He always _____ .","options":["has to do nothing","has nothing to do","nothing has to do","to do nothing has"],"answer":1,"passage":null,"zh":"Nigel Dykes從來沒有事情可做，也就是他總是＿＿＿。","explanation":"has nothing to do 是固定語序，表示「無事可做」。","passageZh":""},{"n":33,"original":83,"type":"reading","q":"According to the passage effects of earthquakes usually include soil movement, fire, tsunami waves, economic loss, and so on.","options":["Yes---if the statement agrees with the information","No--- if the statement contradicts the information","Not given--- if there is no information on this","Not Related--- if the subject is not related to the passage"],"answer":0,"passage":"Damage Caused by Earthquakes Ground shaking leads to landslides and other soil movement. These are the main damage-causing events that occur during an earthquake. Primary effects that can accompany an earthquake include property damage, loss of lives, fire, and tidal waves. Secondary effects, such as economic loss, disease, and lack of food and clean water, also occur after a large earthquake. Ground Shaking and Landslide Earthquakes make the ground move, shaking buildings and structure and causing poorly designed or weak structures to partially or totally collapse. The ground shaking weakens soils and foundation materials under structures and causes dramatic changes in fine-grained soils. During an earthquake, wet sandy soil becomes like liquid mud, an effect called liquefaction. Liquefaction causes damage as the foundation soil beneath structures and buildings weakens. Shaking may also remove large earth and rock masses, producing dangerous landslides, and mudslides that may lead to loss of lives or further property damage. Another post-earthquake threat is fire, such as the fires that happened in San Francisco after the 1906 earthquake and after the devastating 1923 Tokyo earthquake. In the 1923 earthquake, about 130,000 lives were lost in Tokyo, Yokohama, and other cities, many in firestorms fanned by high winds. The amount of damage caused by post-earthquake fire depends on the types of building materials used, whether water lines are intact , and whether natural gas mains have been broken. Broken gas mains may lead to numerous fires, and fire fighting cannot be effective if the water mains are not intact to transport water to the fires. Fires can be significantly reduced with pre-earthquake planning, fire-resistant building materials, enforced fire codes, and public fire drills. Along the coasts, sea waves called tidal waves or tsunamis that accompany some large earthquakes centered under the ocean can cause more death and damage than ground shaking. Tsunamis are usually made up of several oceanic waves that travel out from the slipped crack and arrive one after the other on shore. They can strike without warning, often in places very distant from the epicenter of the earthquake. Tsunami waves are sometimes inaccurately referred to as tidal waves, but tidal forces do not cause them. Rather, tsunamis occur when a major crack under the ocean floor suddenly slips. The displaced rock pushes water above it like a giant paddle, producing powerful water waves at the ocean surface. The ocean waves spread out from the surrounding area of the earthquake source and move across the ocean until they reach the coastline, where their height increases as they reach the continental shelf, the part of the earth's crust that slopes, or rises, from the ocean floor up to the land. Tsunamis wash ashore with often disastrous effects such as severe flooding, loss of lives due to drowning, and damage to property.","zh":"根據文章，地震的影響通常包括土壤移動、火災、海嘯、經濟損失等。","explanation":"文章明列地震主要及次要影響，包括土壤移動、火災、海嘯、經濟損失等，因此敘述符合文章，選 Yes。","passageZh":"地震的主要破壞包括地面震動、山崩、建物倒塌、火災及海嘯；大型地震後還可能造成經濟損失、疾病及食物與乾淨水源不足。土壤液化會削弱地基；海底斷層突然滑動則可能形成海嘯。"},{"n":34,"original":84,"type":"reading","q":"The ground shaking weakens soils and foundation materials under buildings and causes slight changes in fine-grained soils.","options":["Yes---if the statement agrees with the information","No--- if the statement contradicts the information","Not given--- if there is no information on this","Not Related--- if the subject is not related to the passage"],"answer":1,"passage":"Damage Caused by Earthquakes Ground shaking leads to landslides and other soil movement. These are the main damage-causing events that occur during an earthquake. Primary effects that can accompany an earthquake include property damage, loss of lives, fire, and tidal waves. Secondary effects, such as economic loss, disease, and lack of food and clean water, also occur after a large earthquake. Ground Shaking and Landslide Earthquakes make the ground move, shaking buildings and structure and causing poorly designed or weak structures to partially or totally collapse. The ground shaking weakens soils and foundation materials under structures and causes dramatic changes in fine-grained soils. During an earthquake, wet sandy soil beco tle for this passage?","options":["Policemens' Life—Fact and Fantasy.","Law and order.","The Reality of Being a Detective.","Drama and Reality."],"answer":0,"passage":"Real policemen, both in Britain and the United States, hardly recognize any resemblance between their lives and what they see on TV—if they ever get home in time. There are similarities, of course, but the cops don't think much of them. The first difference is that a policeman's real life revolves round the law. Most of his training is in criminal law. He has to know exactly what actions are crimes and what evidence can be used to prove them in court. He has to know nearly as much law as a professional lawyer, and what is more, he has to apply it on his feet, in the dark and rain, running down an alley after someone he wants to talk to. Little of his time is spent in chatting to charming ladies or in dramatic confrontations with desperate criminals. He will spend most of his working life typing millions of words on thousands of forms about hundreds of sad, unimportant people who are guilty—or not—of stupid, petty crimes. Most television crime drama is about finding the criminal, as soon as he's arrested, the story is over. In real life, finding criminals is seldom much of a problem. Except in very serious cases like murders and terrorist attacks—where failure to produce results reflects the standing of the police—little effort is spent on searching. The police have elaborate machinery which eventually turns up most wanted men. Having made an arrest, a policeman really starts to work. He has to prove his case in court and to do that he often has to gather a lot of different evidence. Much of this has to be given by people who don't want to get involved in a court case. So, as well as being overworked, a policeman has to be out at all hours of the day and night interviewing his witnesses and persuading them, usually against their own best interests to help them. A third big difference between the drama policeman and the real policeman is that the real detective lives in an unpleasant moral twilight. Detectives are subject to two opposing pressures: first, as members of a police force, they always have to behave with absolute legality; second, as public servants, they have to get results. They can hardly ever do both. Most of the time, some of them have to break the rules in small ways. If the policeman has to deceive the world, the world often deceives him. Hardly anyone he meets tells him the truth. And this separation the policeman feels between himself and the rest of the world is deepened by the simplemindedness—as he sees it—of citizens, social workers, doctors, law-makers, and judges, who, instead of stamping out crime, punish the criminals less severely in the hope that this will make them reform. The result, policemen feel, is that nine-tenths of their work is re-catching people who should have stayed behind bars. This makes them rather cynical.","zh":"這篇文章最適合的標題是什麼？","explanation":"全文核心在比較真實警察生活與電視中的警察形象，因此「Policemen’s Life—Fact and Fantasy」最完整。","passageZh":"文章比較真實警察與電視警察。真實警察必須熟悉刑法，日常大量工作是文書、蒐證、訪談證人及法庭準備，而非戲劇化追捕；同時還面臨合法程序與取得成果之間的壓力。"},{"n":37,"original":87,"type":"reading","q":"It is essential for a policeman to be trained in criminal law _____.","options":["so that he can catch criminals in the street","because many of the criminals he has to catch are dangerous","so that he can justify his arrests in court","because he has to undertake the duties of a professional lawyer"],"answer":2,"passage":"Real policemen, both in Britain and the United States, hardly recognize any resemblance between their lives and what they see on TV—if they ever get home in time. There are similarities, of course, but the cops don't think much of them. The first difference is that a policeman's real life revolves round the law. Most of his training is in criminal law. He has to know exactly what actions are crimes and what evidence can be used to prove them in court. He has to ees it—of citizens, social workers, doctors, law-makers, and judges, who, instead of stamping out crime, punish the criminals less severely in the hope that this will make them reform. The result, policemen feel, is that nine-tenths of their work is re-catching people who should have stayed behind bars. This makes them rather cynical.","zh":"警察接受刑法訓練是必要的，因為＿＿＿。","explanation":"原文強調警察必須知道什麼是犯罪、什麼證據能在法庭證明犯罪，因此刑法訓練是為了能在法庭上證明逮捕與案件。","passageZh":"文章比較真實警察與電視警察。真實警察必須熟悉刑法，日常大量工作是文書、蒐證、訪談證人及法庭準備，而非戲劇化追捕；同時還面臨合法程序與取得成果之間的壓力。"},{"n":38,"original":88,"type":"reading","q":"The everyday life of a policeman is _____.","options":["full of danger","exciting and striking","wasted on unimportant matters","devoted mostly to routine matters"],"answer":3,"passage":"Real policemen, both in Britain and the United States, hardly recognize any resemblance between their lives and what they see on TV—if they ever get home in time. There are similarities, of course, but the cops don't think much of them. The first difference is that a policeman's real life revolves round the law. Most of his training is in criminal law. He has to know exactly what actions are crimes and what evidence can be used to prove them in court. He has to know nearly as much law as a professional lawyer, and what is more, he has to apply it on his feet, in the dark and rain, running down an alley after someone he wants to talk to. Little of his time is spent in chatting to charming ladies or in dramatic confrontations with desperate criminals. He will spend most of his working life typing millions of words on thousands of forms about hundreds of sad, unimportant people who are guilty—or not—of stupid, petty crimes. Most television crime drama is about finding the criminal, as soon as he's arrested, the story is over. In real life, finding criminals is seldom much of a problem. Except in very serious cases like murders and terrorist attacks—where failure to produce results reflects the standing of the police—little effo ntradicts the information","Not given--- if there is no information on this","Not Related--- if the subject is not related to the passage"],"answer":1,"passage":"Most shoplifters agree that the January sales offer wonderful opportunities for a hard-working thief. With the shops so crowded and the staff so busy, it does not require an extraordinary talent to help yourself to one or two little things and escape unnoticed. It is known, in the business, as \"hoisting\". But the hoisting game is not what it used to be. Even at the height of the sales, shoplifters today never know if they are being watched by one of those evil little balls that hang from the ceilings of so many department stores above the most desirable goods. As if that was not troublesome enough for them, they can now be filmed at work and obliged to attend a showing of their performance in court. Selfridges was the first big London store to install closed-circuit videotape equipment to watch its sales floors. In October last year the store won its first court case for shoplifting using as evidence a videotape clearly showing a couple stealing dresses. It was an important test case which encouraged other stores to install similar equipment. When the balls, called sputniks, first made an appearance in shops it was widely believed that their only function was to frighten shoplifters. Their strange appearance, the curious holes and red lights going on and off, certainly made the theory believable. It did not take long, however, for serious shoplifters to start showing suitable respect. Soon after the equipment was in operation at Selfridges, store detective Brian Chadwick was sitting in the control room watching a woman secretly putting bottles of perfume into her bag. \"As she turned to go,\" Chadwick recalled, \"she suddenly looked up at the sputnik and stopped. She could not possibly have seen that the camera was trained on her because it is completely hidden but she must have had a feeling that I was l pect to live to 75-80 He has an excellent chance of avoiding heavy — and prematurely aging — manual labor, and enjoying a comfortable lifestyle. His biggest problem will probably be to resist the temptation to eat too much, exercise too little and become obese. But if he looks after himself, he should remain in fair shape for most of his greatly extended time on earth.","zh":"第一段主要告訴我們＿＿＿。","explanation":"第一段列舉人類追求青春與長壽的各種嘗試，但始終未真正成功，因此選A。","passageZh":"人類數千年來一直追求青春與長壽，曾嘗試各種方法。真正使現代平均壽命大幅延長的因素，是近兩百年生活條件、公共衛生與醫療進步；在富裕社會，維持健康還需避免過量飲食、缺乏運動與肥胖。"},{"n":57,"original":107,"type":"reading","q":"All of the following factors, have contributed to extended life expectancy EXCEPT _______.","options":["living conditions","injections of monkey glands","public health","medical care"],"answer":1,"passage":"Man has wanted a long life for thousands of years, and has invariably been disappointed. Cleopatra is said to have bathed in asses’ milk to stay young and beautiful, but did not live long enough to find out if it worked in old age. The Spanish explorer Juan Ponce de Leon was more famous for his search for the Fountain of Youth than for discovering Florida in 1513. The legend of the Fountain of Youth had reached Europe by the 7th century, and was widely known there in the Middle Ages. When Lucas Cranach was 74, he painted a famous picture of the miraculous spring, with wrinkled old women going in at one end and young beauties coming out at the other. Writers have constantly imagined worlds where people lived to prodigious ages while holding on to their youthful looks and vigor by various means, mostly foul In the real world too, people are prepared to try all kinds of disgusting things, from mud baths to injections of monkey glands, in the hope of staying younger longer. You might think they no longer needed to bother. People today generally live much longer than ever before. By the middle of the 18th century AD, in Western Europe, life expectancy at birth averaged about 30 years. function stats(){$("progress").textContent=`${Math.min(pos+1,order.length)} / ${order.length}`;$("correctCount").textContent=correct;$("accuracy").textContent=answered?Math.round(correct/answered*100)+"%":"0%";$("barFill").style.width=(order.length?Math.min(pos,order.length)/order.length*100:0)+"%"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function studyHTML(q){const letter=String.fromCharCode(65+q.answer);let s=`<h3>學習解說</h3><div class="study-row"><span class="study-label">中文題意：</span>${esc(q.zh||"—")}</div>`;if(q.passageZh)s+=`<div class="study-row"><span class="study-label">文章重點：</span>${esc(q.passageZh)}</div>`;s+=`<div class="study-row"><span class="study-label">正確答案：</span>${letter}) ${esc(q.options[q.answer])}</div><div class="study-row"><span class="study-label">解析：</span>${esc(q.explanation||"—")}</div>`;return s}
function renderFinish(){$("finish").style.display="block";const acc=answered?Math.round(correct/answered*100):0,uw=uniq(wrongBook);$("summary").textContent=`答對 ${correct} 題／作答 ${answered} 題，正確率 ${acc}%。錯題本目前 ${uw.length} 題。`;let gA=0,gC=0,rA=0,rC=0;Object.entries(history).forEach(([k,h])=>{const q=DATA[+k];if(!q)return;if(q.type==="grammar"){gA++;if(h.lastCorrect)gC++}else{rA++;if(h.lastCorrect)rC++}});const pct=(c,a)=>a?Math.round(c/a*100)+"%":"—";$("finishStats").innerHTML=`<div class="resultitem"><span class="muted small">總正確率</span><b>${acc}%</b></div><div class="resultitem"><span class="muted small">文法</span><b>${pct(gC,gA)}</b></div><div class="resultitem"><span class="muted small">閱讀</span><b>${pct(rC,rA)}</b></div><div class="resultitem"><span class="muted small">錯題本</span><b>${uw.length}</b></div>`;$("barFill").style.width="100%";save()}
function render(){if(pos>=order.length){renderFinish();return}$("finish").style.display="none";locked=false;$("nextBtn").disabled=true;$("feedback").style.display="none";$("feedback").className="feedback";$("study").style.display="none";$("study").innerHTML="";$("options").innerHTML="";const q=DATA[order[pos]];$("kind").textContent=q.type==="grammar"?"文法":"閱讀";$("sourceNo").textContent="原題 "+q.original;$("question").textContent=(pos+1)+". "+q.q;if(q.passage){$("passage").textContent=q.passage;$("passage").style.display="block"}else{$("passage").style.display="none"}q.options.forEach((txt,i)=>{const b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+") "+txt;b.addEventListener("click",()=>answer(i,b));$("options").appendChild(b)});stats();save()}
function answer(i,b){if(locked)return;locked=true;answered++;const idx=order[pos],q=DATA[idx],buttons=[...document.querySelectorAll(".option")],ok=i===q.answer;buttons.forEach(x=>x.disabled=true);const prev=history[idx]||{attempts:0,wrongCount:0};history[idx]={attempts:(prev.attempts||0)+1,wrongCount:(prev.wrongCount||0)+(ok?0:1),lastChoice:i,lastCorrect:ok,lastAt:new Date().toISOString()};if(ok){correct++;b.classList.add("correct");$("feedback").textContent="✓ 正確";$("feedback").classList.add("ok")}else{wrong.push(idx);wrongBook=uniq([...wrongBook,idx]);b.classList.add("wrong");buttons[q.answer].classList.add("correct");$("feedback").textContent="✗ 答錯。正確答案："+String.fromCharCode(65+q.answer)+") "+q.options[q.answer];$("feedback").classList.add("bad")}if($("instant").checked)$("feedback").style.display="block";if($("showStudy").checked){$("study").innerHTML=studyHTML(q);$("study").style.display="block"}$("nextBtn").disabled=false;stats();save()}
function resetSession(targetOrder){order=targetOrder;pos=0;correct=0;answered=0;wrong=[];render()}
function showWrongBook(){const list=$("wrongList"),ids=uniq(wrongBook);list.innerHTML="";if(!ids.length){list.innerHTML='<div class="wrong-card">目前沒有錯題紀錄。</div>'}else ids.sort((a,b)=>DATA[a].original-DATA[b].original).forEach(idx=>{const q=DATA[idx],h=history[idx]||{},d=document.createElement("div");d.className="wrong-card";d.innerHTML=`<b>原題 ${q.original}｜${q.type==="grammar"?"文法":"閱讀"}</b><div>${esc(q.q)}</div><div class="small" style="margin-top:6px"><span class="status-bad">曾答錯 ${h.wrongCount||1} 次</span>　正解：${String.fromCharCode(65+q.answer)}) ${esc(q.options[q.answer])}</div><div class="muted small" style="margin-top:5px">${esc(q.explanation||"")}</div>`;list.appendChild(d)});$("wrongModal").classList.add("open")}
$("nextBtn").addEventListener("click",()=>{pos++;render()});
$("restartBtn").addEventListener("click",()=>{if(!confirm("確定要重新開始本次練習嗎？答題進度會重設，但錯題本會保留。"))return;let a=DATA.map((_,i)=>i);if($("shuffle").checked)mix(a);resetSession(a)});
$("wrongBtn").addEventListener("click",()=>{const ids=uniq(wrongBook);if(!ids.length){$("feedback").textContent="目前沒有錯題。";$("feedback").className="feedback ok";$("feedback").style.display="block";return}resetSession(ids)});
$("wrongBookBtn").addEventListener("click",showWrongBook);$("closeWrong").addEventListener("click",()=>$("wrongModal").classList.remove("open"));$("wrongModal").addEventListener("click",e=>{if(e.target===$("wrongModal"))$("wrongModal").classList.remove("open")});
$("againBtn").addEventListener("click",()=>{let a=DATA.map((_,i)=>i);if($("shuffle").checked)mix(a);resetSession(a)});$("reviewWrongBtn").addEventListener("click",()=>$("wrongBtn").click());$("shuffle").addEventListener("change",()=>{let a=DATA.map((_,i)=>i);if($("shuffle").checked)mix(a);resetSession(a)});$("showStudy").addEventListener("change",()=>{save();if(locked){const q=DATA[order[pos]];$("study").innerHTML=studyHTML(q);$("study").style.display=$("showStudy").checked?"block":"none"}});load();render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>

</body>

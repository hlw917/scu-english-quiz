e goods in the shops than in other months.", "options": ["Yes---if the statement agrees with the information", "No--- if the statement contradicts the information", "Not given--- if there is no information on this", "Not Related--- if the subject is not related to the passage"], "answer": 1, "passage": "Most shoplifters agree that the January sales offer wonderful opportunities for a hard-working thief. With the shops so crowded and the staff so busy, it does not require an extraordinary talent to help yourself to one or two little things and escape unnoticed. It is known, in the business, as \"hoisting\". But the hoisting game is not what it used to be. Even at the height of the sales, shoplifters today never know if they are being watched by one of those evil little balls that hang from the ceilings of so many department stores above the most desirable goods. As if that was not troublesome enough for them, they can now be filmed at work and obliged to attend a showing of their performance in court. Selfridges was the first big London store to install closed-circuit videotape equipment to watch its sales floors. In October last year the store won its first court case for shoplifting using as evidence a videotape clearly showing a couple stealing dresses. It was an important test case which encouraged other stores to install similar equipment. When the balls, called sputniks, first made an appearance in shops it was widely believed that their only function was to frighten shoplifters. Their strange appearance, the curious holes and red lights going on and off, certainly made the theory believable. It did not take long, however, for serious shoplifters to start showing suitable respect. Soon after the equipment was in operation at Selfridges, store detective Brian Chadwick was sitting in the control room watching a woman secretly putting bottles of perfume into her bag. \"As she turned to go,\" Chadwick recalled, \"she suddenly looked up at the sputnik and stopped. S -gown and walked quietly downstairs, feeling my way carefully. I found the drawing-room door open and could not remember if I had left it like that. The room was lit up by a pale red glow from the fire which was slowly dying out. I quickly turned on lights but could see nothing unusual. I felt rather ashamed of my foolish behavior and began climbing the stairs when 1 heard the same noise again. It came distinctly from above. I dashed upstairs and went into all the bedrooms one after the other, but there was nothing that could possibly have made such a sound. I went across to one of the windows. It was so cold outside that ice had formed on the window panes. I scraped it away and looked down on the garden below. Lamps from the street in the distance provided sufficient light to see by. It was snowing heavily and a thick white blanket covered everything. The branches of the bare trees looked like white arms against the night sky. There was certainly no sign that anyone had been walking in the garden, for it would have been easy to make out footprints. As I was beginning to feel cold, I went to my room, sat on my bed and waited to see if the noise could come again. It did--from directly above me. Only then did I understand: the water in the pipes leading to the tank in the attic was beginning to freeze and the pipes were protesting loudly!"}, {"n": 43, "original": 93, "type": "reading", "q": "The author woke up at two o'clock in the morning because ________.", "options": ["he had a terrible nightmare", "he wanted to go to the washing room", "he started to work at that time", "he was woken by a loud unknown noise"], "answer": 3, "passage": "Mysterious Noise It must have been about two o'clock in the morning when I was woken suddenly by a loud banging noise. It was such a bitterly night that I did not fancy the idea of getting up, so I sat in bed and listened. Since I heard nothing more, I concluded that the sound must have come from the street. I was just pulling the be s beginning to freeze and the pipes were protesting loudly!"}, {"n": 47, "original": 97, "type": "reading", "q": "McDonald's was founded _____.", "options": ["by a kitchen equipment salesman .", "in California.", "by a marketing genius called Dick McDonald.", "after the first World War."], "answer": 1, "passage": "McDonald’s is the world single biggest food provider with annual sales of around $12.4bn. And the company’s symbol Ronald McDonald is now (or so the company claims) the word’s most recognized person after Santa Claus.\n\nThe first McDonald’s restaurant was opened in San Bernardino, California, in 1948 by brothers Mac and Richard “Dick” McDonald. Mac ran the restaurant side; Dick was the marketing genius. He had already invented the drive-in laundry and had been the first person to use neon lights in advertising. Now he spotted the gap in the post-war, baby-boom market for cheap, family-orientated restaurants with simple menus, standardized food and efficient service.\n\nAfter a slow start, business began to boom. By 1954, the brothers were joined by another entrepreneur, a kitchen equipment salesman called Ray A Kroc who owned the franchise to the Multimixer, milk shake maker used throughout the McDonald’s chain. A year later, Kroc had bought the McDonald brothers’ chain of 25 franchises for the equivalent of around $70m(￡44m). Dick remained with the company until the Seventies, when he and Kroc fell out over Kroc’s claim that the chain was his creation.\n\nToday, an almost Stalinist cult of personality surrounds Kroc (who died in 1984) at McDonald’s, while the brothers who gave the company its name have all but been written out of its history. But though Kroc did not found McDonald’s, he was certainly responsible for the empire-building philosophy which led to its world domination. He ushered in such essential contributions to international cuisine as the Big Mac (1968) and the Egg McMuffin (1973); and helped launch Ronald McDonald ---- “in any language h

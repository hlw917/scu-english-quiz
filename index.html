"audio":"audio/long41-45.m4a","group":"41-45"},{"n":46,"type":"long","transcript":"M: Mrs. Debbie, shall we start with some basic facts and figures? W: Good idea. M: How many Christians are now living in China? W: The number is 15 million in China. But when we say Christians, we basically refer to Protestants, not Catholics. So we have 15 million Protestants. M: Where are they distributed in the country? Are there many in coastal areas? W: Yes, because most of the Chinese population lives along the east coast, therefore most Christians are in this area. M: You mentioned Protestants and Catholics. Are there more Protestants than Catholics in China or the other way round? W: Yes, indeed. There are far more Protestants than Catholics in China. M: Is there an increase of Catholics or Protestants? What is the general tendency? W: I’m not sure about the number of Catholics in China in 1949. But I know there were 70,000 Protestants in 1949, and now the total number is 15 million. M: It is quite a rapid growth. W: Yes, they grew really fast. M: Can you tell us about your personal experience in terms of freedom of religious belief? W: For me, I don’t feel my religious conduct is restricted by any policies or anything else. I pray almost every Sunday in different churches in downtown Beijing. I teach courses in seminaries. I don’t feel at all restricted.","translation":"男：Debbie女士，我們先從一些基本事實與數據談起，好嗎？女：好。男：目前中國有多少基督徒？女：有1,500萬人。不過這裡所說的基督徒基本上是指新教徒，而不是天主教徒，所以是1,500萬名新教徒。男：他們主要分布在哪裡？沿海地區很多嗎？女：是的，因為大多數中國人口居住在東部沿海，所以大多數基督徒也在這個地區。男：你提到新教徒和天主教徒，中國是哪一種比較多？女：新教徒遠比天主教徒多。男：天主教徒或新教徒的人數有增加嗎？整體趨勢如何？女：我不確定1949年中國天主教徒的人數，但我知道1949年有7萬名新教徒，而現在總數是1,500萬。男：成長相當快速。女：是的，真的成長得很快。男：就宗教信仰自由而言，可以談談你的個人經驗嗎？女：對我而言，我不覺得自己的宗教活動受到任何政策或其他因素限制。我幾乎每個星期日都會在北京城區不同的教會祈禱，也在神學院授課。我完全不覺得受到限制。","q":"What religion does the woman believe in?","zh":"女士信仰什麼宗教？","options":["Buddhism.","Islam.","Christianity.","Judaism."],"answer":2,"explanation":"基督宗教；依上下文較可能是新教（Protestant）。","answerText":"基督宗教；依上下文較可能是新教（Protestant）。","audio":"audio/long46-50.m4a","group":"46-50"},{"n":47,"type":"long","transcript":"M: Mrs. Debbie, shall we start with some basic facts and figures? W: Good idea. M: How many Christians are now living in China? W: The number is 15 million in China. But when we say Christians, we basically refer to Protestants, not Catholics. So we have 15 million Protestants. M: Where are they distributed in the country? Are there many in coastal areas? W: Yes, because most of the Chinese population lives along the east coast, therefore most Christians are in this area. M: You mentioned Protestants and Catholics. Are there more Protestants than Catholics in China or the other way round? W: Yes, indeed. There are far more Protestants than Catholics in China. M: Is there an increase of Catholics or Protestants? What is the general tendency? W: I’m not sure about the number of Catholics in China in 1949. But I know there were 70,000 Protestants in 1949, and now the total number is 15 million. M: It is quite a rapid growth. W: Yes, they grew really fast. M: Can you tell us about your personal experience in terms of freedom of religious belief? W: For me, I don’t feel my religious conduct is restricted by any policies or anything else. I pray almost every Sunday in different churches in downtown Beijing. I teach courses in seminaries. I don’t feel at all restricted.","translation":"男：Debbie女士，我們先從一些基本事實與數據談起，好嗎？女：好。男：目前中國有多少基督徒？女：有1,500萬人。不過這裡所說的基督徒基本上是指新教徒，而不是天主教徒，所以是1,500萬名新教徒。男：他們主要分布在哪裡？沿海地區很多嗎？女：是的，因為大多數中國人口居住在東部沿海，所以大多數基督徒也在這個地區。男：你提到新教徒和天主教徒，中國是哪一種比較多？女：新教徒遠比天主教徒多。男：天主教徒或新教徒的人數有增加嗎？整體趨勢如何？女：我不確定1949年中國天主教徒的人數，但我知道1949年有7萬名新教徒，而現在總數是1,500萬。男：成長相當快速。女：是的，真的成長得很快。男：就宗教信仰自由而言，可以談談你的個人經驗嗎？女：對我而言，我不覺得自己的宗教活動受到任何政策或其他因素限制。我幾乎每個星期日都會在北京城區不同的教會祈禱，也在神學院授課。我完全不覺得受到限制。","q":"Which of the following is NOT true?","zh":"下列哪一項敘述不正確？","options":["There are 15 million Catholics in China. ✓ 正確答案：A","The number of Protestants in 1949 was 70,000.","There are far more Protestants than Catholics in China.","Most Christians live along the east coast."],"answer":0,"explanation":"原檔沒有選項，無法判定選項答案。文中明確指出新教徒比天主教徒多，且多分布在東部沿海。","answerText":"原檔沒有選項，無法判定選項答案。文中明確指出新教徒比天主教徒多，且多分布在東部沿海。","audio":"audio/long46-50.m4a","group":"46-50"},{"n":48,"type":"long","transcript":"M: Mrs. Debbie, shall we start with some basic facts and figures? W: Good idea. M: How many Christians are now living in China? W: The number is 15 million in China. But when we say Christians, we basically refer to Protestants, not Catholics. So we have 15 million Protestants. M: Where are they distributed in the country? Are there many in coastal areas? W: Yes, because most of the Chinese population lives along the east coast, therefore most Christians are in this area. M: You mentioned Protestants and Catholics. Are there more Protestants than Catholics in China or the other way round? W: Yes, indeed. There are far more Protestants than Catholics in China. M: Is there an increase of Catholics or Protestants? What is the general tendency? W: I’m not sure about the number of Catholics in China in 1949. But I know there were 70,000 Protestants in 1949, and now the total number is 15 million. M: It is quite a rapid growth. W: Yes, they grew really fast. M: Can you tell us about your personal experience in terms of freedom of religious belief? W: For me, I don’t feel my religious conduct is restricted by any policies or anything else. I pray almost every Sunday in different churches in downtown Beijing. I teach courses in seminaries. I don’t feel at all restricted.","translation":"男：Debbie女士，我們先從一些基本事實與數據談起，好嗎？女：好。男：目前中國有多少基督徒？女：有1,500萬人。不過這裡所說的基督徒基本上是指新教徒，而不是天主教徒，所以是1,500萬名新教徒。男：他們主要分布在哪裡？沿海地區很多嗎？女：是的，因為大多數中國人口居住在東部沿海，所以大多數基督徒也在這個地區。男：你提到新教徒和天主教徒，中國是哪一種比較多？女：新教徒遠比天主教徒多。男：天主教徒或新教徒的人數有增加嗎？整體趨勢如何？女：我不確定1949年中國天主教徒的人數，但我知道1949年有7萬名新教徒，而現在總數是1,500萬。男：成長相當快速。女：是的，真的成長得很快。男：就宗教信仰自由而言，可以談談你的個人經驗嗎？女：對我而言，我不覺得自己的宗教活動受到任何政策或其他因素限制。我幾乎每個星期日都會在北京城區不同的教會祈禱，也在神學院授課。我完全不覺得受到限制。","q":"Which is true about the woman’s freedom of religious belief?","zh":"關於女士的宗教信仰自由，哪一項是正確的？","options":["She doesn’t feel restricted in praying.","She doesn’t feel restricted when teaching courses in senior schools.","She doesn’t feel restricted when going to churches on Saturday.","All of the above."],"answer":3,"explanation":"她表示自己的宗教活動沒有感受到政策或其他因素的限制。","answerText":"她表示自己的宗教活動沒有感受到政策或其他因素的限制。","audio":"audio/long46-50.m4a","group":"46-50"},{"n":49,"type":"long","transcript":"M: Mrs. Debbie, shall we start with some basic facts and figures? W: Good idea. M: How many Christians are now living in China? W: The number is 15 million in China. But when we say Christians, we basically refer to Protestants, not Catholics. So we have 15 million Protestants. M: Where are they distributed in the country? Are there many in coastal areas? W: Yes, because most of the Chinese population lives along the east coast, therefore most Christians are in this area. M: You mentioned Protestants and Catholics. Are there more Protestants than Catholics in China or the other way round? W: Yes, indeed. There are far more Protestants than Catholics in China. M: Is there an increase of Catholics or Protestants? What is the general tendency? W: I’m not sure about the number of Catholics in China in 1949. But I know there were 70,000 Protestants in 1949, and now the total number is 15 million. M: It is quite a rapid growth. W: Yes, they grew really fast. M: Can you tell us about your personal experience in terms of freedom of religious belief? W: For me, I don’t feel my religious conduct is restricted by any policies or anything else. I pray almost every Sunday in different churches in downtown Beijing. I teach courses in seminaries. I don’t feel at all restricted.","translation":"男：Debbie女士，我們先從一些基本事實與數據談起，好嗎？女：好。男：目前中國有多少基督徒？女：有1,500萬人。不過這裡所說的基督徒基本上是指新教徒，而不是天主教徒，所以是1,500萬名新教徒。男：他們主要分布在哪裡？沿海地區很多嗎？女：是的，因為大多數中國人口居住在東部沿海，所以大多數基督徒也在這個地區。男：你提到新教徒和天主教徒，中國是哪一種比較多？女：新教徒遠比天主教徒多。男：天主教徒或新教徒的人數有增加嗎？整體趨勢如何？女：我不確定1949年中國天主教徒的人數，但我知道1949年有7萬名新教徒，而現在總數是1,5 const $=id=>document.getElementById(id);let mode=null,data=[],order=[],pos=0,correct=0,answered=0,wrong=[],locked=false;const key='scu_english_quiz_v12';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function mix(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function uniq(a){return [...new Set(a)]}

function stats(){$('progress').textContent=`${Math.min(pos+1,order.length)} / ${order.length}`;$('correctCount').textContent=correct;$('accuracy').textContent=answered?Math.round(correct/answered*100)+'%':'0%';$('barFill').style.width=(order.length?Math.min(pos,order.length)/order.length*100:0)+'%'}
function studyHTML(q){let letter=String.fromCharCode(65+q.answer),x='<h3>學習解說</h3>';if(mode==='listening'){x+=`<div class="study-row"><span class="study-label">題目中文：</span>${esc(q.zh)}</div><div class="study-row"><span class="study-label">英文原文：</span>${esc(q.transcript)}</div><div class="study-row"><span class="study-label">中文翻譯：</span>${esc(q.translation)}</div>`}else{x+=`<div class="study-row"><span class="study-label">中文題意：</span>${esc(q.zh)}</div>`;if(q.passageZh)x+=`<div class="study-row"><span class="study-label">文章重點：</span>${esc(q.passageZh)}</div>`}x+=`<div class="study-row"><span class="study-label">正確答案：</span>${letter}) ${esc(q.options[q.answer])}</div>`;if(q.answerText)x+=`<div class="study-row"><span class="study-label">答案中文：</span>${esc(q.answerText)}</div>`;x+=`<div class="study-row"><span class="study-label">解析：</span>${esc(q.explanation||q.answerText||'—')}</div>`;return x}
function renderFinish(){$('finish').style.display='block';$('summary').textContent=`答對 ${correct} 題／作答 ${answered} 題，正確率 ${answered?Math.round(correct/answered*100):0}%。`;let u=uniq(wrong);$('finishStats').innerHTML=`<div class="resultitem"><span class="muted small">作答</span><b>${answered}</b></div><div class="resultitem"><span class="muted small">答對</span><b>${correct}</b></div><div class="resultitem"><span class="muted small">錯題</span><b>${u.length}</b></div>`;$('barFill').style.width='100%';save()}
function render(){if(pos>=order.length){renderFinish();return}$('finish').style.display='none';locked=false;$('nextBtn').disabled=true;$('feedback').className='feedback';$('feedback').style.display='none';$('study').style.display='none';$('options').innerHTML='';let q=data[order[pos]];$('kind').textContent=mode==='listening'?(q.type==='short'?'短篇聽力':'長篇聽力'):(q.type==='grammar'?'文法':'閱讀');$('sourceNo').textContent=mode==='listening'?`第 ${q.n} 題`:`原題 ${q.original}`;$('question').textContent=`${pos+1}. ${q.q}`;
if(mode==='listening'){$('audioBox').classList.remove('hidden');$('audio').src='./'+q.audio;$('audioHint').textContent=q.type==='long'?`第 ${q.group} 題共用同一篇音檔；可重複播放。`:'先聽音檔，再選擇答案。';$('passage').classList.add('hidden')}else{$('audioBox').classList.add('hidden');$('audio').pause();$('audio').removeAttribute('src');if(q.passage){$('passage').textContent=q.passage;$('passage').classList.remove('hidden')}else $('passage').classList.add('hidden')}
q.options.forEach((t,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+') '+t;b.onclick=()=>answer(i,b);$('options').appendChild(b)});stats();save()}
function answer(i,b){if(locked)return;locked=true;answered++;let idx=order[pos],q=data[idx],bs=[...document.querySelectorAll('.option')],ok=i===q.answer;bs.forEach(x=>x.disabled=true);if(ok){correct++;b.classList.add('correct');$('feedback').textContent='✓ 正確';$('feedback').className='feedback ok'}else{wrong.push(idx);b.classList.add('wrong');bs[q.answer].classList.add('correct');$('feedback').textContent='✗ 答錯。正確答案：'+String.fromCharCode(65+q.answer)+') '+q.options[q.answer];$('feedback').className='feedback bad'}$('feedback').style.display='block';if($('showStudy').checked){$('study').innerHTML=studyHTML(q);$('study').style.display='block'}$('nextBtn').disabled=false;stats();save()}
function reset(a){order=a;pos=correct=answered=0;wrong=[];render()}
function goToOriginal(no){
  no=parseInt(no,10);
  if(!Number.isInteger(no)||no<1||no>110){alert('請輸入 1～110 的題號。');return}
  mode=no<=50?'listening':'reading';
  data=mode==='reading'?READING:LISTENING;
  $('shuffle').checked=false;
  order=data.map((_,i)=>i);
  correct=answered=0;wrong=[];
  const idx=data.findIndex(q=>Number(q.original||q.n)===no);
  if(idx<0){alert('找不到第 '+no+' 題。');return}
  pos=idx;
  $('home').classList.add('hidden');
  $('quiz').classList.remove('hidden');
  $('title').textContent=mode==='reading'?'文法＋閱讀 60 題':'聽力 50 題';
  $('subtitle').textContent=mode==='reading'?'原題第 51～110 題｜指定題號練習':'Part A 短篇 1～30｜Part B 長篇 31～50｜指定題號練習';
  save();render();
}
$('startNoBtn').onclick=()=>goToOriginal($('startNo').value);
$('startNo').onkeydown=e=>{if(e.key==='Enter')$('startNoBtn').click()};
$('jumpBtn').onclick=()=>goToOriginal($('jumpNo').value);
$('jumpNo').onkeydown=e=>{if(e.key==='Enter')$('jumpBtn').click()};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>loadMode(b.dataset.mode));$('homeBtn').onclick=()=>{if(mode==='listening'){$('audio').pause();$('audio').removeAttribute('src')}mode=null;$('quiz').classList.add('hidden');$('home').classList.remove('hidden')};$('nextBtn').onclick=()=>{pos++;render()};$('restartBtn').onclick=()=>{if(confirm('確定重新開始本次練習？')){let a=data.map((_,i)=>i);if($('shuffle').checked)mix(a);reset(a)}};$('wrongBtn').onclick=()=>{let a=uniq(wrong);if(!a.length){$('feedback').textContent='本次目前沒有錯題。';$('feedback').className='feedback ok';return}reset(a)};$('againBtn').onclick=()=>{let a=data.map((_,i)=>i);if($('shuffle').checked)mix(a);reset(a)};$('reviewWrongBtn').onclick=()=>$('wrongBtn').click();$('shuffle').onchange=()=>{let a=data.map((_,i)=>i);if($('shuffle').checked)mix(a);reset(a)};
</script><script>
if('serviceWorker' in navigator){
  let refreshing=false, waitingWorker=null;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing)return;
    refreshing=true;
    location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const r=await navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'});
      await r.update();
      const showUpdate=w=>{
        if(!w)return;
        waitingWorker=w;
        $('update').style.display='block';
      };
      if(r.waiting)showUpdate(r.waiting);
      r.addEventListener('updatefound',()=>{
        const w=r.installing;
        if(!w)return;
        w.addEventListener('statechange',()=>{
          if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate(w);
        });
      });
      $('updateBtn').onclick=()=>{
        const w=waitingWorker||r.waiting;
        if(w)w.postMessage({type:'SKIP_WAITING'});
        else location.reload();
      };
    }catch(e){console.warn('Service worker update failed:',e)}
  });
}
</script></body></html>

:root{--blue:#0b5cab;--blue2:#eaf3ff;--line:#d9e0e8;--muted:#667085;--ok:#087443;--bad:#b42318;--study:#5b36a6}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:#f4f7fb;color:#172033}.app{max-width:920px;margin:auto;padding:18px 14px 36px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}h1{font-size:26px;margin:0 0 5px}.muted{color:var(--muted)}.small{font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 20px rgba(20,40,80,.05)}.home{display:grid;gap:14px}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{border:2px solid var(--line);background:#fff;border-radius:16px;padding:20px;text-align:left;cursor:pointer}.mode:hover{border-color:var(--blue)}.mode h2{margin:0 0 8px;font-size:21px}.mode b{color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 13px}.stat b{display:block;font-size:18px;margin-top:3px}.topline,.actions,.settings{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.badge{display:inline-block;background:#e8f1ff;color:#064f99;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}.bar{height:7px;background:#e9edf5;border-radius:10px;overflow:hidden;margin:12px 0 18px}.bar>div{height:100%;background:var(--blue);width:0}.question{font-size:20px;font-weight:700;line-height:1.55;margin:14px 0}.passage{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.6;max-height:330px;overflow:auto}.options{display:grid;gap:9px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px;font-size:16px;cursor:pointer}.option.correct{border-color:#1a9b65;background:#eaf8f1}.option.wrong{border-color:#d92d20;background:#fff0ef}.feedback{display:none;margin-top:12px;padding:10px 12px;border-radius:10px}.feedback.ok{display:block;background:#eaf8f1;color:var(--ok)}.feedback.bad{display:block;background:#fff0ef;color:var(--bad)}.study{display:none;margin-top:12px;border:1px solid #d9cdf9;background:#f7f3ff;border-radius:12px;padding:14px;line-height:1.65}.study h3{margin:0 0 8px;color:var(--study)}.study-row{margin:7px 0}.study-label{font-weight:700;color:var(--study)}.ctrl{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.actions{justify-content:flex-start;margin-top:14px}.audioBox{background:var(--blue2);border:1px solid #bfd8f5;border-radius:13px;padding:13px;margin-bottom:12px}.audioBox audio{width:100%;margin-top:8px}.audioHint{font-size:13px;color:#40566e}.finish{display:none}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.resultitem{border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}.resultitem b{display:block;font-size:18px}.back{border:0;background:transparent;color:var(--blue);font-weight:700;cursor:pointer;padding:4px 0}.install{margin-top:14px}.update{display:none;background:#fff4d6;border:1px solid #f1cd72;border-radius:10px;padding:10px 12px;margin-bottom:12px}.update button{margin-left:8px}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}@media(max-width:620px){.modegrid{grid-template-columns:1fr}.resultgrid{grid-template-columns:1fr 1fr}header{display:block}.settings{margin-top:10px;justify-content:flex-start}.question{font-size:18px}}

<script>const READING=[{"n":1,"original":51,"type":"grammar","q":"Little boys who play truant don't go to school _____ .","options":["because they are ill","because they have left","because they are not allowed to","on purpose"],"answer":3,"passage":null,"zh":"逃學的小男孩不去上學，是因為＿＿＿。","explanation":"play truant 是「逃學、翹課」，本身就含有故意不上學的意思，因此選 on purpose（故意地）。","passageZh":"","answerText":"故意地"},{"n":2,"original":52,"type":"grammar","q":"“Where have you been hiding?” she asked. She asked me where _____ hiding.","options":["I had been","had I been","had been I","had I being"],"answer":0,"passage":null,"zh":"「你一直躲在哪裡？」她問。改為間接問句：她問我一直躲在哪裡。","explanation":"直接問句改成間接問句後要用陳述句語序；主句 asked 是過去式，原本現在完成進行式要回溯為過去完成進行概念，因此選 I had been。","passageZh":"","answerText":"我之前一直在躲藏"},{"n":3,"original":53,"type":"grammar","q":"I am used to traveling by air. I am _____ to it.","options":["accustomed","habitual","customary","inhabited"],"answer":0,"passage":null,"zh":"我習慣搭飛機旅行。換句話說，我已經＿＿＿這件事。","explanation":"be used to + 名詞／V-ing 表示「習慣於」；accustomed to 與 used to 在此同義。","passageZh":"","answerText":"習慣的"},{"n":4,"original":54,"type":"grammar","q":"He saluted as they passed. He saluted ______.","options":["while they had passed","while they were passing","though they were passing","because they had passed"],"answer":1,"passage":null,"zh":"他們經過時，他敬禮。哪一個改寫意思相同？","explanation":"as 在此表示「當……時」，等同 while they were passing，強調動作進行中的同時。","passageZh":"","answerText":"當他們正在經過時"},{"n":5,"original":55,"type":"grammar","q":"Recently it was damaged. She damaged it _____.","options":["late","lastly","lately","finally"],"answer":2,"passage":null,"zh":"最近它被弄壞了。她＿＿＿把它弄壞。","explanation":"recently 與 lately 都可表示「最近」；late 是遲、lastly 是最後一點、finally 是終於。","passageZh":"","answerText":"最近"},{"n":6,"original":56,"type":"grammar","q":"He wanted to measure temperatures. He wanted to _____ them.","options":["count","make","do","take"],"answer":3,"passage":null,"zh":"他想測量溫度，也就是想＿＿＿溫度。","explanation":"英文固定搭配是 take a temperature / take temperatures，表示量體溫／測量溫度。","passageZh":"","answerText":"量測"},{"n":7,"original":57,"type":"grammar","q":"The ______ of finding gold in California attracted a lot of people to settle down there.","options":["prospects","speculations","stakes","provisions"],"answer":0,"passage":null,"zh":"在加州找到黃金的＿＿＿吸引許多人到那裡定居。","explanation":"prospect 可指「可能性、前景」；the prospects of finding gold 即找到黃金的可能性／前景。","passageZh":"","answerText":"前景／可能性"},{"n":8,"original":58,"type":"grammar","q":"Lights were blazing. They were _____ .","options":["gleaming","shining","reflecting","being burnt"],"answer":1,"passage":null,"zh":"燈光熊熊／明亮地發光，也就是它們正在＿＿＿。","explanation":"blaze 在燈光語境表示強烈發光，與 shining 最接近。","passageZh":"","answerText":"發光"},{"n":9,"original":59,"type":"grammar","q":"He as taking his savings to the post office. He keeps his savings _____the post office.","options":["to","in","on","into"],"answer":1,"passage":null,"zh":"他把積蓄帶到郵局。他把積蓄存＿＿＿郵局。","explanation":"表示「把錢存在郵局」使用介系詞 in：keep savings in the post office。","passageZh":"","answerText":"在……裡"},{"n":10,"original":60,"type":"grammar","q":"The girl returned the money. She was very _____.","options":["honourable","honest","honoured","trusting"],"answer":1,"passage":null,"zh":"女孩把錢還回去了。她非常＿＿＿。","explanation":"撿到／拿到錢後歸還，表現的是 honest（誠實）。honourable 偏「可敬的」。","passageZh":"","answerText":"誠實的"},{"n":11,"original":61,"type":"grammar","q":"The boys had put out the campfire. The fire wasn't _____.","options":["switched on","on fire","on","alight"],"answer":3,"passage":null,"zh":"男孩們已經把營火熄滅。火已經不再＿＿＿。","explanation":"put out the fire 表示把火熄滅；alight 表示「燃燒著的」，not alight 即已熄滅。","passageZh":"","answerText":"燃燒著的"},{"n":12,"original":62,"type":"grammar","q":"Byrd now knew he would be able to _____ the South Pole.","options":["arrive at","arrive","reach at","reach in"],"answer":0,"passage":null,"zh":"Byrd現在知道自己能夠＿＿＿南極。","explanation":"arrive 是不及物動詞，到達地點通常用 arrive at；reach 則直接加地點，不能用 reach at。","passageZh":"","answerText":"抵達南極"},{"n":13,"original":63,"type":"grammar","q":"_____ eventually brought to the shore, it was found to be very long.","options":["Been","When","On being","When it was being"],"answer":2,"passage":null,"zh":"＿＿＿最後被帶到岸上時，發現它非常長。","explanation":"On being + 過去分詞表示「在被……時／一被……之後」，符合被帶到岸上的被動語意。","passageZh":"","answerText":"當被帶上岸時"},{"n":14,"original":64,"type":"grammar","q":"Goods were sent from various parts of the world. They came from _____ parts.","options":["mixed","assorted","different","mixed up"],"answer":2,"passage":null,"zh":"貨物從世界各地運來，也就是來自＿＿＿地區。","explanation":"various parts = different parts，表示不同的／各種地區。","passageZh":"","answerText":"不同的"},{"n":15,"original":65,"type":"grammar","q":"A gust of wind swept the bed off the roof. The wind blew very _____ .","options":["hard","fast","quickly","soon"],"answer":0,"passage":null,"zh":"一陣強風吹走屋頂上的床。風颳得非常＿＿＿。","explanation":"形容風雨猛烈常用 hard，如 The wind blew hard。fast/quickly 不自然。","passageZh":"","answerText":"猛烈地"},{"n":16,"original":66,"type":"grammar","q":"The American dream does not come to those who fall _______.","options":["sleeping","sleep","asleep","slept"],"answer":2,"passage":null,"zh":"美國夢不會降臨在那些＿＿＿的人身上。","explanation":"fall asleep 是固定搭配，表示「睡著」。","passageZh":"","answerText":"睡著"},{"n":17,"original":67,"type":"grammar","q":"Wallis Island is a remote place in the South Pacific. It is _____.","options":["far away","well-known","popular","close to the European continent"],"answer":0,"passage":null,"zh":"Wallis Island是南太平洋一個偏遠地方，也就是它非常＿＿＿。","explanation":"remote 表示偏遠的，最接近 far away。","passageZh":"","answerText":"遙遠的"},{"n":18,"original":68,"type":"grammar","q":"Workers began _____ a number of wooden boxes.","options":["unload","to unloading","unloaded","unloading"],"answer":3,"passage":null,"zh":"工人開始＿＿＿許多木箱。","explanation":"begin 可接 to V 或 V-ing；選項中只有 unloading 文法正確。","passageZh":"","answerText":"卸貨／卸下"},{"n":19,"original":69,"type":"grammar","q":"_____ had it been wrapped up in? A newspaper.","options":["Where","Who","How","What"],"answer":3,"passage":null,"zh":"它是用＿＿＿包起來的？用報紙。","explanation":"詢問「用什麼包裝」用 What：What had it been wrapped up in?","passageZh":"","answerText":"什麼"},{"n":20,"original":70,"type":"grammar","q":"Someone had filled the parcel with stones and sand. It was _____stones and sand.","options":["full with","full of","full by","full in"],"answer":1,"passage":null,"zh":"有人在包裹裡裝滿石頭和沙。也就是包裹＿＿＿石頭和沙。","explanation":"be full of 是固定搭配，表示「充滿……」。","passageZh":"","answerText":"裝滿……"},{"n":21,"original":71,"type":"grammar","q":"The money _____ in his room.","options":["was","were","care","has"],"answer":0,"passage":null,"zh":"錢＿＿＿在他的房間裡。","explanation":"money 通常視為不可數名詞，搭配單數動詞 was。","passageZh":"","answerText":"是／在"},{"n":22,"original":72,"type":"grammar","q":"He admitted hiding in the box. He _____ it.","options":["announced","described","confessed","declared"],"answer":2,"passage":null,"zh":"他承認躲在箱子裡，也就是他＿＿＿這件事。","explanation":"admit 在此與 confess（承認）最接近。","passageZh":"","answerText":"坦承"},{"n":23,"original":73,"type":"grammar","q":"It was covered with coins. There were coins _____it.","options":["in","over","under","all over"],"answer":3,"passage":null,"zh":"它被硬幣覆蓋，也就是硬幣＿＿＿它。","explanation":"all over 表示「遍布、覆蓋在……各處」。","passageZh":"","answerText":"遍布、到處都是"},{"n":24,"original":74,"type":"grammar","q":"She probably stamped out the letters 'SOS' with her _____.","options":["hands","head","feet","knees"],"answer":2,"passage":null,"zh":"她可能用她的＿＿＿踩出「SOS」字樣。","explanation":"stamp out letters 表示踩／踏出字樣，依語境用 feet。","passageZh":"","answerText":"腳"},{"n":25,"original":75,"type":"grammar","q":"She must be at least thirty-five years old. In my opinion she _____.","options":["has","is","can","must"],"answer":1,"passage":null,"zh":"她至少35歲。依我的看法，她＿＿＿35歲。","explanation":"原句 must be 是推測「一定／至少是」；改寫為 In my opinion she is...，空格需 be 動詞 is。","passageZh":"","answerText":"是"},{"n":26,"original":76,"type":"grammar","q":"How many times did the clock _____ ?","options":["hit","beat","knock","strike"],"answer":3,"passage":null,"zh":"時鐘敲了幾次？","explanation":"鐘「敲響」使用 strike；如 The clock struck twelve。","passageZh":"","answerText":"敲響"},{"n":27,"original":77,"type":"grammar","q":"He has just bought a new house. He has been in it _____ a short time.","options":["since","for","about","ago"],"answer":1,"passage":null,"zh":"他剛買新房子。他住進去只有＿＿＿一小段時間。","explanation":"一段持續時間搭配 for；since 後接起點。","passageZh":"","answerText":"持續一段時間"},{"n":28,"original":78,"type":"grammar","q":"They hoped to find buried treasure. They hoped they _____ it.","options":["would find","had found","will find","are going to find"],"answer":0,"passage":null,"zh":"他們希望找到埋藏的寶藏，也就是希望他們＿＿＿它。","explanation":"過去式 hoped 後談當時的未來，用 would find。","passageZh":"","answerText":"會找到"},{"n":29,"original":79,"type":"grammar","q":"The police _____ Dan's bicycle.","options":["had been finding","had been found","had found","have been finding"],"answer":2,"passage":null,"zh":"警方＿＿＿Dan的腳踏車。","explanation":"題庫答案為 had found，表示在另一過去時間點之前警方已找到腳踏車。","passageZh":"","answerText":"已經找到"},{"n":30,"original":80,"type":"grammar","q":"The thief _____ the wallet in newspaper.","options":["wound","rolled","wrapped","bound"],"answer":2,"passage":null,"zh":"小偷用報紙＿＿＿錢包。","explanation":"wrap A in B = 用B包住A；wrapped the wallet in newspaper。","passageZh":"","answerText":"包裹"},{"n":31,"original":81,"type":"grammar","q":"He set a new world record. He _____ a new record.","options":["did","played","created","found"],"answer":2,"passage":null,"zh":"他創下新的世界紀錄，也就是他＿＿＿一項新紀錄。","explanation":"create a record 可表「創造／創下紀錄」，與 set a record 對應。","passageZh":"","answerText":"創造"},{"n":32,"original":82,"type":"grammar","q":"Nigel Dykes never has anything to do. He always _____ .","options":["has to do nothing","has nothing to do","nothing has to do","to do nothing has"],"answer":1,"passage":null,"zh":"Nigel Dykes從來沒有事情可做，也就是他總是＿＿＿。","explanation":"has nothing to do 是固定語序，表示「無事可做」。","passageZh":"","answerText":"沒有事情可做"},{"n":33,"original":83,"type":"reading","q":"According to the passage effects of earthquakes usually include soil movement, fire, tsunami waves, economic loss, and so on.","options":["Yes---if the statement agrees with the information","No--- if the statement contradicts the information","Not given--- if there is no information on this","Not Related--- if the subject is not related to the passage"],"answer":0,"passage":"Damage Caused by Earthquakes Ground shaking leads to landslides and other soil movement. These are the main damage-causing events that occur during an earthquake. Primary effects that can accompany an earthquake include property damage, loss of lives, fire, and tidal waves. Secondary effects, such as economic loss, disease, and lack of food and clean water, also occur after a large earthquake. Ground Shaking and Landslide Earthquakes make the ground move, shaking buildings and structure and causing poorly designed or weak structures to partially or totally collapse. The ground shaking weakens soils and foundation materials under structures and causes dramatic changes in fine-grained soils. During an earthquake, wet sandy soil becomes like liquid mud, an effect called liquefaction. Liquefaction causes damage as the foundation soil beneath structures and buildings weakens. Shaking may also remove large earth and rock masses, producing dangerous landslides, and mudslides that may lead to loss of lives or further property damage. Another post-earthquake threat is fire, such as the fires that happened in San Francisco after the 1906 earthquake and after the devastating 1923 Tokyo earthquake. In the 1923 earthquake, about 130,000 lives were lost in Tokyo, Yokohama, and other cities, many in firestorms fanned by high winds. The amount of damage caused by post-earthquake fire depends on the types of building materials used, whether water lines are intact , and whether natural gas mains have been broken. Broken gas mains may lead to numerous fires, and fire fighting cannot be effective if the water mains are not intact to transport water to the fires. Fires can be significantly reduced with pre-earthquake planning, fire-resistant building materials, enforced fire codes, and public fire drills. Along the coasts, sea waves called tidal waves or tsunamis that accompany some large earthquakes centered under the ocean can cause more death and damage than ground shaking. Tsunamis are usually made up of several oceanic waves that travel out from the slipped crack and arrive one after the other on shore. They can strike without warning, often in places very distant from the epicenter of the earthquake. Tsunami waves are sometimes inaccurately referred to as tidal waves, but tidal forces do not cause them. Rather, tsunamis occur when a major crack under the ocean floor suddenly slips. The displaced rock pushes water above it like a giant paddle, producing powerful water waves at the ocean surface. The ocean waves spread out from the surrounding area of the earthquake source and move across the ocean until they reach the coastline, where their height increases as they reach the continental shelf, the part of the earth's crust that slopes, or rises, from the ocean floor up to the land. Tsunamis wash ashore with often disastrous effects such as severe flooding, loss of lives due to drowning, and damage to property.","zh":"根據文章，地震的影響通常包括土壤移動、火災、海嘯、經濟損失等。","explanation":"文章明列地震主要及次要影響，包括土壤移動、火災、海嘯、經濟損失等，因此敘述符合文章，選 Yes。","passageZh":"地震的主要破壞包括地面震動、山崩、建物倒塌、火災及海嘯；大型地震後還可能造成經濟損失、疾病及食物與乾淨水源不足。土壤液化會削弱地基；海底斷層突然滑動則可能形成海嘯。","answerText":"是——如果敘述與文章資訊相符"},{"n":34,"original":84,"type":"reading","q":"The ground shaking weakens soils and foundation materials under buildings and causes slight changes in fine-grained soils.","options":["Yes---if the statement agrees with the information","No--- if the statement contradicts the information","Not given--- if there is no information on this","Not Related--- if the subject is not related to the passage"],"answer":1,"passage":"Damage Caused by Earthquakes Ground shaking leads to landslides and oth  water waves at the ocean surface. The ocean waves spread out from the surrounding area of the earthquake source and move across the ocean until they reach the coastline, where their height increases as they reach the continental shelf, the part of the earth's crust that slopes, or rises, from the ocean floor up to the land. Tsunamis wash ashore with often disastrous effects such as severe flooding, loss of lives due to drowning, and damage to property.","zh":"本文主要討論如何預測破產。","explanation":"文章主題是地震造成的損害，與「預測破產」完全無關，因此選 Not Related。","passageZh":"地震的主要破壞包括地面震動、山崩、建物倒塌、火災及海嘯；大型地震後還可能造成經濟損失、疾病及食物與乾淨水源不足。土壤液化會削弱地基；海底斷層突然滑動則可能形成海嘯。","answerText":"不相關——如果主題與文章無關"},{"n":36,"original":86,"type":"reading","q":"What is the best title for this passage?","options":["Policemens' Life—Fact and Fantasy.","Law and order.","The Reality of Being a Detective.","Drama and Reality."],"answer":0,"passage":"Real policemen, both in Britain and the United States, hardly recognize any resemblance between their lives and what they see on TV—if they ever get home in time. There are similarities, of course, but the cops don't think much of them. The first difference is that a policeman's real life revolves round the law. Most of his training is in criminal law. He has to know exactly what actions are crimes and what evidence can be used to prove them in court. He has to know nearly as much law as a professional lawyer, and what is more, he has to apply it on his feet, in the dark and rain, running down an alley after someone he wants to talk to. Little of his time is spent in chatting to charming ladies or in dramatic confrontations with desperate criminals. He will spend most of his working life typing millions of words on thousands of forms about hundreds of sad, unimportant people who are guilty—or not—of stupid, petty crimes. Most television crime drama is about finding the criminal, as soon as he's arrested, the story is over. In real life, finding criminals is seldom much of a problem. Except in very serious cases like murders and terrorist attacks—where failure to produce results reflects the standing of the police—little effort is spent on searching. The police have elaborate machinery which eventually turns up most wanted men. Having made an arrest, a policeman really starts to work. He has to prove his case in court and to do that he often has to gather a lot of different evidence. Much of this has to be given by people who don't want to get involved in a court case. So, as well as being overworked, a policeman has to be out at all hours of the day and night interviewing his witnesses and persuading them, usually against their own best interests to help them. A third big difference between the drama policeman and the real policeman is that the real detective lives in an unpleasant moral twilight. Detectives are subject to two opposing pressures: first, as members of a police force, they always have to behave with absolute legality; second, as public servants, they have to get results. They can hardly ever do both. Most of the time, some of them have to break the rules in small ways. If the policeman has to deceive the world, the world often deceives him. Hardly anyone he meets tells him the truth. And this separation the policeman feels between himself and the rest of the world is deepened by the simplemindedness—as he sees it—of citizens, social workers, doctors, law-makers, and judges, who, instead of stamping out crime, punish the criminals less severely in the hope that this will make them reform. The result, policemen feel, is that nine-tenths of their work is re-catching people who should have stayed behind bars. This makes them rather cynical.","zh":"這篇文章最適合的標題是什麼？","explanation":"全文核心在比較真實警察生活與電視中的警察形象，因此「Policemen’s Life—Fact and Fantasy」最完整。","passageZh":"文章比較真實警察與電視警察。真實警察必須熟悉刑法，日常大量工作是文書、蒐證、訪談證人及法庭準備，而非戲劇化追捕；同時還面臨合法程序與取得成果之間的壓力。","answerText":"警察的生活——事實與想像"},{"n":37,"original":87,"type":"reading","q":"It is essential for a policeman t t. He has to know nearly as much law as a professional lawyer, and what is more, he has to apply it on his feet, in the dark and rain, running down an alley after someone he wants to talk to. Little of his time is spent in chatting to charming ladies or in dramatic confrontations with desperate criminals. He will spend most of his working life typing millions of words on thousands of forms about hundreds of sad, unimportant people who are guilty—or not—of stupid, petty crimes. Most television crime drama is about finding the criminal, as soon as he's arrested, the story is over. In real life, finding criminals is seldom much of a problem. Except in very serious cases like murders and terrorist attacks—where failure to produce results reflects the standing of the police—little effort is spent on searching. The police have elaborate machinery which eventually turns up most wanted men. Having made an arrest, a policeman really starts to work. He has to prove his case in court and to do that he often has to gather a lot of different evidence. Much of this has to be given by people who don't want to get involved in a court case. So, as well as being overworked, a policeman has to be out at all hours of the day and night interviewing his witnesses and persuading them, usually against their own best interests to help them. A third big difference between the drama policeman and the real policeman is that the real detective lives in an unpleasant moral twilight. Detectives are subject to two opposing pressures: first, as members of a police force, they always have to behave with absolute legality; second, as public servants, they have to get results. They can hardly ever do both. Most of the time, some of them have to break the rules in small ways. If the policeman has to deceive the world, the world often deceives him. Hardly anyone he meets tells him the truth. And this separation the policeman feels between himself and the rest of the world is deepened by the simpleminded er stores to install similar equipment. When the balls, called sputniks, first made an appearance in shops it was widely believed that their only function was to frighten shoplifters. Their strange appearance, the curious holes and red lights going on and off, certainly made the theory believable. It did not take long, however, for serious shoplifters to start showing suitable respect. Soon after the equipment was in operation at Selfridges, store detective Brian Chadwick was sitting in the control room watching a woman secretly putting bottles of perfume into her bag. \"As she turned to go,\" Chadwick recalled, \"she suddenly looked up at the sputnik and stopped. She could not possibly have seen that the camera was trained on her because it is completely hidden but she must have had a feeling that I was looking at her.\" \"For a moment she paused, and then she returned to the counter and started putting everything back. When she had finished, she opened her bag towards the camera to show it was empty and hurried out of the store.\"","zh":"一月是扒手行竊的好月份，因為商店裡的商品比其他月份更多。","explanation":"一月好下手的原因是商店擁擠、員工忙碌，不是因為商品數量較多，因此敘述錯誤，選 No。","passageZh":"一月特賣期間人潮擁擠、店員忙碌，曾是扒手的好機會；但百貨公司開始使用隱藏式閉路攝影設備（sputniks），可錄下行竊並作為法庭證據，也具有嚇阻效果。","answerText":"否——如果敘述與文章資訊矛盾"},{"n":40,"original":90,"type":"reading","q":"The sputniks hanging from the ceiling are intended to make films that can be used as evidence.","options":["Yes---if the statement agrees with the information","No--- if the statement contradicts the information","Not given--- if there is no information on this","Not Related--- if the subject is not related to the passage"],"answer":0,"passage":"Most shoplifters agree that the January sales offer wonderful opportunities for a hard-working thief. With the shops so crowded and the staff so busy, it does not require an extraordinary talent to help yourself to one or two little things and escape unnoticed. It is known, in the business, as \"hoisting\". But the hoisting game is not what al cuisine as the Big Mac (1968) and the Egg McMuffin (1973); and helped launch Ronald McDonald ---- “in any language he means fun” ---- on to television in 1963.\n\nEvery three hours, a new McDonald’s franchise opens somewhere in the world; it can be found in more than 100 countries including India (vegetarian-only to avoid offending the non-beef-eating populace) and Israel (non kosher, despite fierce local objection). McDonald’s chain embodied the thrusting, can-do spirit of Fifties America with staff mottoes such as “If you’ve got time to lean, you’ve go time to clean.”","zh":"麥當勞創立於＿＿＿。","explanation":"原文指出第一家McDonald’s餐廳1948年在California的San Bernardino開設，因此選B。","passageZh":"文章介紹麥當勞簡史：1948年McDonald兄弟在加州開設第一家餐廳，兄弟分工營運與行銷；之後Ray Kroc加入並推動加盟與全球擴張，也促成Big Mac、Egg McMuffin及Ronald McDonald等品牌元素。","answerText":"在加州"},{"n":48,"original":98,"type":"reading","q":"What do we know about McDonald's brothers?","options":["They were not McDonald's founders although they named the restaurant.","Their business was still in depression after several years.","They had clear job separation on business.","They sold their restaurant to a salesman in 1954."],"answer":2,"passage":"McDonald’s is the world single biggest food provider with annual sales of around $12.4bn. And the company’s symbol Ronald McDonald is now (or so the company claims) the word’s most recognized person after Santa Claus.\n\nThe first McDonald’s restaurant was opened in San Bernardino, California, in 1948 by brothers Mac and Richard “Dick” McDonald. Mac ran the restaurant side; Dick was the marketing genius. He had already invented the drive-in laundry and had been the first person to use neon lights in advertising. Now he spotted the gap in the post-war, baby-boom market for cheap, family-orientated restaurants with simple menus, standardized food and efficient service.\n\nAfter a slow start, business began to boom. By 1954, the brothers were joined by another entrepreneur, a kitchen equipment salesman called Ray A nties, when he and Kroc fell out over Kroc’s claim that the chain was his creation.\n\nToday, an almost Stalinist cult of personality surrounds Kroc (who died in 1984) at McDonald’s, while the brothers who gave the company its name have all but been written out of its history. But though Kroc did not found McDonald’s, he was certainly responsible for the empire-building philosophy which led to its world domination. He ushered in such essential contributions to international cuisine as the Big Mac (1968) and the Egg McMuffin (1973); and helped launch Ronald McDonald ---- “in any language he means fun” ---- on to television in 1963.\n\nEvery three hours, a new McDonald’s franchise opens somewhere in the world; it can be found in more than 100 countries including India (vegetarian-only to avoid offending the non-beef-eating populace) and Israel (non kosher, despite fierce local objection). McDonald’s chain embodied the thrusting, can-do spirit of Fifties America with staff mottoes such as “If you’ve got time to lean, you’ve go time to clean.”","zh":"根據文章，下列哪一項敘述正確？","explanation":"原文稱Ronald McDonald「in any language he means fun」，並稱其知名度僅次於Santa Claus，因此D符合文章。","passageZh":"文章介紹麥當勞簡史：1948年McDonald兄弟在加州開設第一家餐廳，兄弟分工營運與行銷；之後Ray Kroc加入並推動加盟與全球擴張，也促成Big Mac、Egg McMuffin及Ronald McDonald等品牌元素。","answerText":"據稱麥當勞叔叔這個象徵在任何語言中都代表歡樂，是僅次於聖誕老人、全球最廣為人知的人物。"},{"n":51,"original":101,"type":"reading","q":"This passage is mainly concerned with _____.","options":["brief history of McDonald's.","McDonald's success.","Ray A Kroc, leader of the McDonald's empire.","McDonald brothers, founder of McDonald's."],"answer":0,"passage":"McDonald’s is the world single biggest food provider with annual sales of around $12.4bn. And the company’s symbol Ronald McDonald is now (or so the company claims) the word’s most recognized person after Santa Claus.\n\nThe first McDonald’s restaurant was opened in San Bernardino, California, in 1948 by brothers Mac and Richard “Dick” McDonald. Mac ran the restaurant side; Dick was the marketing genius. He had already invented the drive-in laundry and had been the first person to use neon lights in advertising. Now he spotted the gap in the post-war, baby-boom market for cheap, family-orientated restaurants with simple menus, standardized food and efficient service.\n\nAfter a slow start, business began to boom. By 1954, the brothers were joined by another entrepreneur, a kitchen equipment salesman called Ray A Kroc who owned the franchise to the Multimixer, milk shake maker used throughout the McDonald’s chain. A year later, Kroc had bought the McDonald brothers’ chain of 25 franchises for the equivalent of around $70m(￡44m). Dick remained with the company until the Seventies, when he and Kroc fell out over Kroc’s claim that the chain was his creation.\n\nToday, an almost Stalinist cult of personality surrounds Kroc (who died in 1984) at McDonald’s, while the brothers who gave the company its name have all but been written out of its history. But though Kroc did not found McDonald’s, he was certainly responsible for the empire-building philosophy which led to its world domination. He ushered in such essential contributions to international cuisine as the Big Mac (1968) and the Egg McMuffin (1973); and helped launch Ronald McDonald ---- “in any language he means fun” ---- on to television in 1963.\n\nEvery three hours, a new McDonald’s franchise opens somewhere in the world; it can be found in more than 100 countries including India (vegetarian-only to avoid offending the non-beef-eating populace) and Israel (non kosher, despite fierce local objection). McDonald’s chain embodied the thrusting, can-do spirit of Fifties America with staff mottoes such as “If you’ve got time to lean, you’ve go time to clean.”","zh":"本文主要在談＿＿＿。","explanation":"文章從創立、Kroc加入到全球擴張，重點是麥當勞的簡史，因此選A。","passageZh":"文章介紹麥當勞簡史：1948年McDonald兄弟在加州開設第一家餐廳，兄弟分工營運與行銷；之後Ray Kroc加入並推動加盟與全球擴張，也促成Big Mac、Egg McMuffin及Ronald McDonald等品牌元素。","answerText":"麥當勞的簡史"},{"n":52,"original":102,"type":"reading","q":"The sentence “Teachers are committed to students and their learning” means that teachers _______.","options":["should meet all the standards of students and be concerned with them","should set very high demands on students","should be very kind to students","must be responsible for students and their learning"],"answer":3,"passage":"In October 1987, the national Board for professional Teaching Standards begins its work to set new standards of accomplishment for the teaching profession and to improve the quality of education available to all children in the United States. Teachers are committed to students and their learning. They must act on the belief that all students can learn. They must recognize individual differences in their students and adjust their practice accordingly. They must know that their mission extends beyond developing the cognitive capacity of their students. They must be concerned with their students’ self-concept, with their motivation, and with the development of character. Teachers must know what the subjects they teach and how to teach them. They must command specialized knowledge of how to convey a subject to students. Teachers are responsible for managing and monitoring students learning. They must call on multiple methods to meet their goals, knowing and being able to employ a variety of instructional skills. Teachers must think systematically about their practice and learn from experience, seeking the advice of others and drawing on education research and scholarship to improve their practice. As members of learning communities, teachers contribute to school effectiveness by collaborating with community as a powerful resource for learning.","zh":"「Teachers are committed to students and their learning」表示教師＿＿＿。","explanation":"be committed to 表示「致力於、對……負責」，所以句意是教師必須對學生及其學習負責，選D。","passageZh":"文章說明專業教師的高標準：對學生及學習負責、因材施教、關心動機與品格、熟悉學科及教學法、運用多元教學方法、反思經驗並與其他教師及社區合作。","answerText":"必須對學生及其學習負責"},{"n":53,"original":103,"type":"reading","q":"The teachers’ task should go beyond developing the learning ability of students and they should _______.","options":["know the subjects they teach","transmit valued knowledge","respect their students, know about their interests and develop their characters","seek the advice of others"],"answer":2,"passage":"In October 1987, the national Board for professional Teaching Standards begins its work to set new standards of accomplishment for the teaching profession and to improve the quality of education available to all children in the United States. Teachers are committed to students and their learning. They must act on the belief that all students can learn. They must recognize individual differences in their students and adjust their practice accordingly. They must know that their mission extends beyond developing the cognitive capacity of their students. They must be concerned with their students’ self-concept, with their motivation, and with the development of character. Teachers must know what the subjects they teach and how to teach them. They must command specialized knowledge of how to convey a subject to students. Teachers are responsible for managing and monitoring students learning. They must call on multiple methods to meet their goals, knowing and being able to employ a variety of instructional skills. Teachers must think systematically about their practice and learn from experience, seeking the advice of others and drawing on education research and scholarship to improve their practice. As members of learning communities, teachers contribute to school effectiveness by collaborating with community as a powerful resource for learning.","zh":"教師的任務應超越培養學生的學習能力，並且應＿＿＿。","explanation":"原文說教師使命不只發展認知能力，也要關心學生自我概念、動機與品格，因此C最符合。","passageZh":"文章說明專業教師的高標準：對學生及學習負責、因材施教、關心動機與品格、熟悉學科及教學法、運用多元教學方法、反思經驗並與其他教師及社區合作。","answerText":"尊重學生、了解他們的興趣並培養其品格"},{"n":54,"original":104,"type":"reading","q":"School effectiveness mainly depends on _______.","options":["teachers who work together","students","teaching materials","school leaders"],"answer":0,"passage":"In October 1987, the national Board for professional Teaching Standards begins its work to set new standards of accomplishment for the teaching profession and to improve the quality of education available to all children in the United States. Teachers are committed to students and their learning. They must act on the belief that all students can learn. They must recognize individual differences in their students and adjust their practice accordingly. They must know that their mission extends beyond developing the cognitive capacity of their students. They must be concerned with their students’ self-concept, with their motivation, and with the development of character. Teachers must know what the subjects they teach and how to teach them. They must command specialized knowledge of how to convey a subject to students. Teachers are responsible for managing and monitoring students learning. They must call on multiple methods to meet their goals, knowing and being able to employ a variety of instructional skills. Teachers must think systematically about their practice and learn from experience, seeking the advice of others and drawing on education research and scholarship to improve their practice. As members of learning communities, teachers contribute to school effectiveness by collaborating with community as a powerful resource for learning.","zh":"學校效能主要取決於＿＿＿。","explanation":"文章末段指出教師作為學習共同體成員，透過合作提升學校效能，因此選 teachers who work together。","passageZh":"文章說明專業教師的高標準：對學生及學習負責、因材施教、關心動機與品格、熟悉學科及教學法、運用多元教學方法、反思經驗並與其他教師及社區合作。","answerText":"共同合作的教師"},{"n":55,"original":105,"type":"reading","q":"The best title for this passage is “_______.”","options":["How to Manage Student Learning","Learning from Experience","Relations Between Teachers and Students","Toward High Standards of Teachers"],"answer":3,"passage":"In October 1987, the national Board for professional Teaching Standards begins its work to set new standards of accomplishment for the teaching profession and to improve the quality of education available to all children in the United States. Teachers are committed to students and their learning. They must act on the belief that all students can learn. They must recognize individual differences in their students and adjust their practice accordingly. They must know that their mission extends beyond developing the cognitive capacity of their students. They must be concerned with their students’ self-concept, with their motivation, and with the development of character. Teachers must know what the subjects they teach and how to teach them. They must command specialized knowledge of how to convey a subject to students. Teachers are responsible for managing and monitoring students learning. They must call on multiple methods to meet their goals, knowing and being able to employ a variety of instructional skills. Teachers must think systematically about their practice and learn from experience, seeking the advice of others and drawing on education research and scholarship to improve their practice. As members of learning communities, teachers contribute to school effectiveness by collaborating with community as a powerful resource for learning.","zh":"本文最佳標題是＿＿＿。","explanation":"全文列出專業教師應達到的多項標準，因此最佳標題是 Toward High Standards of Teachers。","passageZh":"文章說明專業教師的高標準：對學生及學習負責、因材施教、關心動機與品格、熟悉學科及教學法、運用多元教學方法、反思經驗並與其他教師及社區合作。","answerText":"邁向高標準的教師"},{"n":56,"original":106,"type":"reading","q":"The first paragraph mainly tells us that _______.","options":["man’s dream for long life has ended up fruitless","man has long searched for the Fountain of Youth","Cleopatra managed to live a long life by bathing in asses’ milk","the Spanish explorer Juan Ponce de Leon discovered Florida in 1513"],"answer":0,"passage":"Man has wanted a long life for thousands of years, and has invariably been disappointed. Cleopatra is said to have bathed in asses’ milk to stay young and beautiful, but did not live long enough to find out if it worked in old age. The Spanish explorer Juan Ponce de Leon was more famous for his search for the Fountain of Youth than for discovering Florida in 1513. The legend of the Fountain of Youth had reached Europe by the 7th century, and was widely known there in the Middle Ages. When Lucas Cranach was 74, he painted a famous picture of the miraculous spring, with wrinkled old women going in at one end and young beauties coming out at the other. Writers have constantly imagined worlds where people lived to prodigious ages while holding on to their youthful looks and vigor by various means, mostly foul In the real world too, people are prepared to try all kinds of disgusting things, from mud baths to injections of monkey glands, in the hope of staying younger longer. You might think they no longer needed to bother. People today generally live much longer than ever before. By the middle of the 18th century AD, in Western Europe, life expectancy at birth averaged about 30 years. Now, that figure for the world as a whole is about 65, thanks to the past two centuries’ improvements in living conditions, public health and medical care. A baby born today in affluent North America or Western Europe can expect to live to 75-80 He has an excellent chance of avoiding heavy — and prematurely aging — manual labor, and enjoying a comfortable lifestyle. His biggest problem will probably be to resist the temptation to eat too much, exercise too little and become obese. But if he looks after himself, he should remain in fair shape for most of his greatly extended time on earth.","zh":"第一段主要告訴我們＿＿＿。","explanation":"第一段列舉人類追求青春與長壽的各種嘗試，但始終未真正成功，因此選A。","passageZh":"人類數千年來一直追求青春與長壽，曾嘗試各種方法。真正使現代平均壽命大幅延長的因素，是近兩百年生活條件、公共衛生與醫療進步；在富裕社會，維持健康還需避免過量飲食、缺乏運動與肥胖。","answerText":"人類追求長壽的夢想一直沒有成果"},{"n":57,"original":107,"type":"reading","q":"All of the following factors, have contributed to extended l table lifestyle. His biggest problem will probably be to resist the temptation to eat too much, exercise too little and become obese. But if he looks after himself, he should remain in fair shape for most of his greatly extended time on earth.","zh":"根據最後一段，可以推論＿＿＿是威脅長壽的一項主要因素。","explanation":"依題庫答案選C。文章指出現代富裕社會的人有很大機會避免沉重、使人提早老化的體力勞動，故可推知 heavy manual labor 會威脅長壽。","passageZh":"人類數千年來一直追求青春與長壽，曾嘗試各種方法。真正使現代平均壽命大幅延長的因素，是近兩百年生活條件、公共衛生與醫療進步；在富裕社會，維持健康還需避免過量飲食、缺乏運動與肥胖。","answerText":"繁重的體力勞動"},{"n":59,"original":109,"type":"reading","q":"According to the author, one can easily enjoy a long life nowadays in affluent societies if he or she avoids all of the following EXCEPT _______.","options":["overeating","too little exercise","a comfortable lifestyle","obesity"],"answer":2,"passage":"Man has wanted a long life for thousands of years, and has invariably been disappointed. Cleopatra is said to have bathed in asses’ milk to stay young and beautiful, but did not live long enough to find out if it worked in old age. The Spanish explorer Juan Ponce de Leon was more famous for his search for the Fountain of Youth than for discovering Florida in 1513. The legend of the Fountain of Youth had reached Europe by the 7th century, and was widely known there in the Middle Ages. When Lucas Cranach was 74, he painted a famous picture of the miraculous spring, with wrinkled old women going in at one end and young beauties coming out at the other. Writers have constantly imagined worlds where people lived to prodigious ages while holding on to their youthful looks and vigor by various means, mostly foul In the real world too, people are prepared to try all kinds of disgusting things, from mud baths to injections of monkey glands, in the hope of staying younger longer. You might think they no longer needed to bother. People today generally live much longer than ever before. By the middle of the 18th century AD, in Western Europe, life expectancy at birth averaged about 30 years. Now, that figure for the world as a whole is about 65, thanks to the past two centuries’ improvements in living conditions, public health and medical care. A baby born today in affluent North America or Western Europe can expect to live to 75-80 He has an excellent chance of avoiding heavy — and prematurely aging — manual labor, and enjoying a comfortable lifestyle. His biggest problem will probably be to resist the temptation to eat too much, exercise too little and become obese. But if he looks after himself, he should remain in fair shape for most of his greatly extended time on earth.","zh":"作者認為，在富裕社會中若要長壽，下列都應避免，除了＿＿＿。","explanation":"文章提醒避免吃太多、運動太少與肥胖；comfortable lifestyle 本身不是要避免的事項，因此選C。","passageZh":"人類數千年來一直追求青春與長壽，曾嘗試各種方法。真正使現代平均壽命大幅延長的因素，是近兩百年生活條件、公共衛生與醫療進步；在富裕社會，維持健康還需避免過量飲食、缺乏運動與肥胖。","answerText":"舒適的生活方式"},{"n":60,"original":110,"type":"reading","q":"Which of the following statements is supposed to be the best title for the passage?","options":["The Fountain of Youth and Long Life","Attempts to Stay Young","Affluent Societies and Extended Life Expectancy","Man’s Long Dream for a Long Life"],"answer":3,"passage":"Man has wanted a long life for thousands of years, and has invariably been disappointed. Cleopatra is said to have bathed in asses’ milk to stay young and beautiful, but did not live long enough to find out if it worked in old age. The Spanish explorer Juan Ponce de Leon was more famous for his search for the Fountain of Youth than for discovering Florida in 1513. The legend of the Fountain of Youth had reached Europe by the 7th century, and was widely known there in the Middle Ages. When Lucas Cranach was 74, he painted a famous picture of the miraculous spring, with wrinkled old women going in at one end and young beauties coming out at the other. Writers have constantly imagined worlds where people lived to prodigious ages while holding on to their youthful looks and vigor by various means, mostly foul In the real world too, people are prepared to try all kinds of disgusting things, from mud baths to injections of monkey glands, in the hope of staying younger longer. You might think they no longer needed to bother. People today generally live much longer than ever before. By the middle of the 18th century AD, in Western Europe, life expectancy at birth averaged about 30 years. Now, that figure for the world as a whole is about 65, thanks to the past two centuries’ improvements in living conditions, public health and medical care. A baby born today in affluent North America or Western Europe can expect to live to 75-80 He has an excellent chance of avoiding heavy — and prematurely aging — manual labor, and enjoying a comfortable lifestyle. His biggest problem will probably be to resist the temptation to eat too much, exercise too little and become obese. But if he looks after himself, he should remain in fair shape for most of his greatly extended time on earth.","zh":"下列哪一項最適合作為本文標題？","explanation":"全文從古代追求青春長壽談到現代壽命延長，核心是人類長久以來追求長壽的夢想，因此選D。","passageZh":"人類數千年來一直追求青春與長壽，曾嘗試各種方法。真正使現代平均壽命大幅延長的因素，是近兩百年生活條件、公共衛生與醫療進步；在富裕社會，維持健康還需避免過量飲食、缺乏運動與肥胖。","answerText":"人類追求長壽的長久夢想"}];const LISTENING=[{"n":1,"type":"short","transcript":"W: Did Mr. Smith give his employees the $5 a day raise they were asking for? M: At first he refused. Then he wanted to negotiate a smaller figure. But finally he met their demands.","translation":"女：Smith先生有給員工他們要求的每天加薪5美元嗎？男：一開始他拒絕了。接著他想協商一個較低的金額，但最後他答應了他們的要求。","q":"What did you learn about the employees?","zh":"關於這些員工，我們可以得知什麼？","options":["Their raise will be less than $ 5 a day.","Their pay will be raised by $ 5 a day.","They won’t receive a $ 5-a-day raise.","They wanted a raise of more than $ 5 a day."],"answer":1,"explanation":"關鍵句是 “finally he met their demands”，表示Smith先生最後接受員工的要求。","answerText":"員工最後獲得了他們所要求的每天加薪5美元。","audio":"audio/q01.m4a"},{"n":2,"type":"short","transcript":"W: Henry has been acting strange lately. M: I notice that, too. It is unusual of him to work diligently because he used to hate homework so much.","translation":"女：Henry最近的表現很反常。男：我也注意到了。他現在這麼認真用功很不尋常，因為他以前非常討厭做功課。","q":"What can be inferred about Henry?","zh":"關於Henry可以推論出什麼？","options":["Henry usually works diligently.","Henry has become a much better student.","Henry has changed his study habits lately.","Henry doesn’t like homework any more."],"answer":2,"explanation":"“used to hate homework”與現在“work diligently”形成對比。","answerText":"Henry以前不喜歡做功課，但最近變得很用功。","audio":"audio/q02.m4a"},{"n":3,"type":"short","transcript":"M: Wow, What an interesting ring. Is it real diamond? W: Yes. It’s small, but it has a lot of sentimental value.","translation":"男：哇，好特別的戒指。是真的鑽石嗎？女：是的。它雖然小，但對我有很大的紀念價值。","q":"What are the speakers talking about?","zh":"兩人在談論什麼？","options":["The onion ring.","The diamond ring.","A telephone ring.","A sentimental story."],"answer":1,"explanation":"對話直接圍繞 ring、diamond 與其紀念價值。","answerText":"一枚鑽石戒指。","audio":"audio/q03.m4a"},{"n":4,"type":"short","transcript":"M: I’ve been thinking about changing jobs sometime soon. W: Why? Is the stress getting to you? M: Yes, my current position is a little too fast-paced for me.","translation":"男：我最近一直在考慮換工作。女：為什麼？壓力讓你受不了了嗎？男：是的，我目前的工作步調對我來說有點太快。","q":"What does the man mean?","zh":"男士的意思是什麼？","options":["He’s happy with his work.","He’s satisfied with his work.","He’d like to change his job.","He likes his job so much."],"answer":2,"explanation":"“too fast-paced for me”說明目前職位的工作節奏不適合他。","answerText":"他覺得目前工作壓力／步調太快，因此想換工作。","audio":"audio/q04.m4a"},{"n":5,"type":"short","transcript":"W: OK, now we have finished our dinner. Jack, who’s supposed to do the dishes? M: Don’t look at me. It’s Nancy’s turn.","translation":"女：好了，我們吃完晚餐了。Jack，今天應該誰洗碗？男：別看我，輪到Nancy了。","q":"What does Jack mean?","zh":"Jack的意思是什麼？","options":["Nancy is the one that should do it. ✓ 正確答案：A","Nancy is doing a term project.","Nancy’s midterm exam is coming.","Nancy is turning eighteen soon."],"answer":0,"explanation":"“It’s Nancy’s turn”意為這次輪到Nancy。","answerText":"Nancy應該洗碗。","audio":"audio/q05.m4a"},{"n":6,"type":"short","transcript":"M: How did you develop your interest in food? W: Well, food has always been my passion. As a child, I used to love preparing meals with my grandmother.","translation":"男：你是怎麼培養出對食物的興趣的？女：嗯，我一直都很熱愛食物。小時候，我很喜歡和祖母一起準備餐點。","q":"When did the woman start to like cooking?","zh":"這位女士什麼時候開始喜歡烹飪？","options":["When she was little. ✓ 正確答案：A","When she took cooking lessons at school.","After she found an excellent recipe book.","After she got married."],"answer":0,"explanation":"她說“As a child”就喜歡與祖母準備餐點。","answerText":"從小時候開始。","audio":"audio/q06.m4a"},{"n":7,"type":"short","transcript":"M: Hey, look at Susan, all dressed up. Any special occasion today? She’s going to date or something? W: No, I don’t think so. Haven’t you noticed? She’s never been late or worn the same dress twice since she got promoted. I’d say she’s fishing for compliments.","translation":"男：嘿，你看Susan，打扮得這麼漂亮。今天有什麼特別場合嗎？她要去約會之類的嗎？女：不，我不這麼認為。你沒注意到嗎？自從升職後，她從沒遲到，也沒穿過同一件衣服兩次。我看她是在想博取別人的讚美。","q":"What does the woman think about Susan?","zh":"女士對Susan有什麼看法？","options":["She wants to be praised. ✓ 正確答案：A","Today is her birthday.","She deserves the promotion.","Fishing is her favorite activity."],"answer":0,"explanation":"“fishing for compliments”是慣用語，意指故意引導別人稱讚自己。","answerText":"她認為Susan刻意表現、希望獲得別人的稱讚。","audio":"audio/q07.m4a"},{"n":8,"type":"short","transcript":"W: Joe, what are you doing for summer break? M: I would like to go to Italy and work at a restaurant in Florence. My uncle owns a restaurant there and he has offered me a job for the summer. It is an excellent opportunity for me to practice my Italian. I hope to be a translator one day.","translation":"女：Joe，你暑假要做什麼？男：我想去義大利，在佛羅倫斯的一家餐廳工作。我叔叔在那裡開餐廳，並提供我一份暑期工作。這是練習義大利語的絕佳機會。我希望有一天能成為翻譯。","q":"What does Joe want to do in the future?","zh":"Joe未來想做什麼？","options":["To be a waiter.","To run a restaurant.","To be a tour guide.","To become a translator."],"answer":3,"explanation":"他明確說“I hope to be a translator one day.”","answerText":"成為翻譯。","audio":"audio/q08.m4a"},{"n":9,"type":"short","transcript":"M: Ruth, don’t move. Stand right there. This will be a good shot. The background is very pretty. W: Then, why don’t you just take a photo of the scenery?","translation":"男：Ruth，別動，就站在那裡。這會是一張好照片，背景很漂亮。女：那你何不乾脆只拍風景？","q":"What are the speakers doing?","zh":"兩人在做什麼？","options":["Taking a picture. ✓ 正確答案：A","Doing a haircut.","Shopping.","Shooting."],"answer":0,"explanation":"“good shot”、“take a photo”顯示正在拍照。","answerText":"正在拍照。","audio":"audio/q09.m4a"},{"n":10,"type":"short","transcript":"M: What do you plan to do after you finish college? W: Of course I’ll try to find a job. But in the meantime, I guess I’ll be helping my uncle in his restaurant. M: I can’t believe that. Don’t tell me you’ll help in the kitchen or help as a waitress. W: Of course not. Since I’m studying business management, I think it would be good practice for me to help him management the restaurant.","translation":"男：大學畢業後你打算做什麼？女：當然我會試著找工作。不過在這段期間，我想我會到叔叔的餐廳幫忙。男：真不敢相信。別告訴我你要去廚房幫忙或當服務生。女：當然不是。因為我念企業管理，我想協助他管理餐廳會是很好的實務練習。","q":"What will the woman do after graduation?","zh":"這位女士畢業後會做什麼？","options":["She’ll help in the kitchen in her uncle’s restaurant.","She’ll take come courses about business management.","She’ll help her uncle manage his business.","She’ll practice some new skills in the kitchen."],"answer":2,"explanation":"她表示畢業後會找工作，期間協助叔叔管理餐廳。","answerText":"先幫叔叔管理餐廳，同時找工作。","audio":"audio/q10.m4a"},{"n":11,"type":"short","transcript":"M: Hi, Susan, I hear that you walk all the way to the office these days. W: Yes, I've found great pleasure in walking. That's the type of exercise I enjoy very much.","translation":"男：嗨，Susan，我聽說你最近都一路走路去辦公室。女：是的，我發現走路很有樂趣。那是我非常喜歡的運動方式。","q":"Why does the woman walk all the way to the office?","zh":"為什麼這位女士一路走路去辦公室？","options":["She takes it as a kind of exercise. ✓ 正確答案：A","She wants to save money.","She loves doing anything that is new.","Her office isn't very far."],"answer":0,"explanation":"她明確表示走路帶給她樂趣，也是她喜歡的運動。","answerText":"因為她喜歡走路，並把它當作自己喜愛的運動。","audio":"audio/q11.m4a"},{"n":12,"type":"short","transcript":"M: Betty, I’ve really enjoyed our conversation today. W: Me, too. We should catch up for coffee sometime next week. M: Great. Let’s get in touch by phone.","translation":"男：Betty，我很享受今天的談話。女：我也是。我們下週找個時間喝咖啡敘敘舊吧。男：好啊，我們電話聯絡。","q":"What does Betty propose?","zh":"Betty提議什麼？","options":["Go shopping.","Exchange phone numbers.","Have coffee with the man sometime next week.","Invite the man to come over for coffee today."],"answer":2,"explanation":"“catch up for coffee sometime next week”就是她的提議。","answerText":"下週一起喝咖啡、敘舊。","audio":"audio/q12.m4a"},{"n":13,"type":"short","transcript":"W: Professor Davis, good evening. My name is Susan Grey. I'm with the local newspaper. Do you mind if I ask you one or two questions? M: Not at all.","translation":"女：Davis教授，晚安。我叫Susan Grey，是本地報社的人。介意我問您一兩個問題嗎？男：完全不介意。","q":"Who is Susan Grey?","zh":"Susan Grey是誰？","options":["A reporter. ✓ 正確答案：A","A teacher.","A writer.","A worker."],"answer":0,"explanation":"她說“I’m with the local newspaper.”","answerText":"當地報社的記者／工作人員。","audio":"audio/q13.m4a"},{"n":14,"type":"short","transcript":"M: What's all that noise? It sounds as if it's coming from next door. The Nelsons aren't back yet, are they? W: I don't think so. It must be the window-cleaner working upstairs.","translation":"男：那些噪音是怎麼回事？聽起來好像從隔壁傳來。Nelson一家還沒回來吧？女：我想還沒有。一定是樓上的窗戶清潔工在工作。","q":"Where does the woman think the noise is coming from?","zh":"女士認為噪音從哪裡來？","options":["From upstairs. ✓ 正確答案：A","From next door.","From the Nelsons’ house.","From the back door."],"answer":0,"explanation":"她說“It must be the window-cleaner working upstairs.”","answerText":"樓上的窗戶清潔工。","audio":"audio/q14.m4a"},{"n":15,"type":"short","transcript":"W: Sometimes the food at the residence hall cafeteria barfs me out. M: Yeah, some of the food looks so gross. W: Especially the beef liver and fish.","translation":"女：有時宿舍餐廳的食物讓我覺得很噁心。男：是啊，有些食物看起來真的很噁心。女：尤其是牛肝和魚。","q":"Which statement is true?","zh":"下列哪一個敘述是正確的？","options":["The woman loves to eat beef liver and fish.","The speakers love the food in their cafeteria.","The speakers don’t like the food in their cafeteria.","The woman wants to go on a diet."],"answer":2,"explanation":"原檔未提供選項，因此無法指出選項代號；答案應選符合上述內容者。","answerText":"可確定兩人都不喜歡／覺得宿舍餐廳的某些食物很噁心，尤其提到牛肝和魚。","audio":"audio/q15.m4a"},{"n":16,"type":"short","transcript":"W: This old copy machine needs to be repaired again. M: It was just fixed two days ago, wasn’t it? W: Yes, it’s time to buy a new one.","translation":"女：這台舊影印機又需要修理了。男：它不是兩天前才剛修好嗎？女：是啊，是時候買一台新的了。","q":"What will the speakers probably do?","zh":"兩人可能會怎麼做？","options":["Use the copy machine.","Call a copy machine technician.","Buy a new copy machine.","Fix the machine themselves."],"answer":2,"explanation":"女士直接說“it’s time to buy a new one.”","answerText":"買一台新的影印機。","audio":"audio/q16.m4a"},{"n":17,"type":"short","transcript":"M: The music is so beautiful that I'd like to dance. But I don't know the steps. W: It doesn't matter. No one will be looking at us in his crowd.","translation":"男：音樂太美了，我很想跳舞，但我不知道舞步。女：沒關係，在這麼多人裡沒有人會注意我們。","q":"What does the woman suggest they do?","zh":"女士建議他們做什麼？","options":["Take a walk.","Give a performance.","Listen to the music.","Dance to the music."],"answer":3,"explanation":"她以沒有人會注意他們來鼓勵男士跳舞。","answerText":"不用擔心舞步，直接去跳舞。","audio":"audio/q17.m4a"},{"n":18,"type":"short","transcript":"M: I can't seem to find Turking Street on the map. W: Why don't you ask someone where it is?","translation":"男：我好像在地圖上找不到Turking Street。女：你何不問問別人它在哪裡？","q":"What does the woman mean?","zh":"女士的意思是什麼？","options":["She knows where it is.","She wants to go to the park.","The man should get help in finding the way.","The man can't see the map very well."],"answer":2,"explanation":"“Why don’t you…”在此用來提出建議。","answerText":"她建議男士向別人問路。","audio":"audio/q18.m4a"},{"n":19,"type":"short","transcript":"M: Do you still have those books about art museums that I lent you? W: Yes, but not here in the office. They’re at home. M: I really need them back soon. I have to return them to the library.","translation":"男：我借給你的那些關於美術館的書還在你那裡嗎？女：在，但不在辦公室，在家裡。男：我很快就需要拿回來，我得把它們還給圖書館。","q":"Where are the books now?","zh":"那些書現在在哪裡？","options":["At an art museum.","In the office.","At home.","In the library."],"answer":2,"explanation":"她直接回答“They’re at home.”","answerText":"在女士家裡。","audio":"audio/q19.m4a"},{"n":20,"type":"short","transcript":"W: Dear, I feel hungry now. How about you? M: So do I. Let me call Room Service. Hello, Room Service? Please send a menu to 320 right away.","translation":"女：親愛的，我現在餓了，你呢？男：我也是。我來打電話給客房服務。喂，客房服務嗎？請立刻送一份菜單到320號房。","q":"Where are the two speakers?","zh":"兩位說話者在哪裡？","options":["In a hotel. ✓ 正確答案：A","At a dinner table.","In the street.","In the man’s house."],"answer":0,"explanation":"Room Service及房號320顯示兩人在飯店。","answerText":"在旅館／飯店房間。","audio":"audio/q20.m4a"},{"n":21,"type":"short","transcript":"M: Do you live by the police station? W: No, I live on Mountain View Street by the school.","translation":"男：你住在警察局附近嗎？女：不，我住在Mountain View Street，學校旁邊。","q":"Where does the woman live?","zh":"女士住在哪裡？","options":["By the police station.","On a mountain.","By the school.","Near work."],"answer":2,"explanation":"她直接說明住址位置。","answerText":"住在Mountain View Street、學校附近。","audio":"audio/q21.m4a"},{"n":22,"type":"short","transcript":"W: Those beautiful tigers are endangered. It’s so sad. M: Human are too greedy to murder them for their fur. W: How can we protect them? M: Refuse to purchase fur.","translation":"女：那些美麗的老虎正瀕臨絕種，真令人難過。男：人類太貪婪了，為了牠們的毛皮而殺害牠們。女：我們要怎麼保護牠們？男：拒絕購買毛皮。","q":"What does the woman mean by “endanger”?","zh":"女士所說的「endanger」是什麼意思？","options":["To become extinct ✓ 正確答案：A","To become strange","To sell out","To become danger"],"answer":0,"explanation":"上下文談到老虎因被獵殺而面臨生存威脅。","answerText":"使處於危險中；此處 endangered 指「瀕臨絕種的」。","audio":"audio/q22.m4a"},{"n":23,"type":"short","transcript":"W: The milk wouldn't have turned sour if you had put it in the fridge. M: I thought you had done it.","translation":"女：如果你把牛奶放進冰箱，它就不會酸掉了。男：我以為你已經放了。","q":"What does the woman mean?","zh":"女士的意思是什麼？","options":["The milk had gone bad. ✓ 正確答案：A","The milk hadn't turned sour.","The man had put away the milk.","The man had drunk the milk."],"answer":0,"explanation":"這是與過去事實相反的假設語氣：若當時有冷藏，就不會變酸。","answerText":"男士沒有把牛奶放進冰箱，所以牛奶酸掉了。","audio":"audio/q23.m4a"},{"n":24,"type":"short","transcript":"M: Can I get a large one to go? W: I’m sorry, we seem to be out of large cups. Can I offer you a medium instead? M: Alright, I’ll have milk but no sugar please.","translation":"男：我可以要一大杯外帶嗎？女：抱歉，我們好像沒有大杯了，可以改給您中杯嗎？男：好吧，我要加牛奶，但不要糖。","q":"What is the man doing?","zh":"男士正在做什麼？","options":["Grocery shopping.","Trying on shoes.","Ordering a cup of coffee.","Opening a window."],"answer":2,"explanation":"large cup、milk、no sugar及to go顯示他正在點外帶飲料。","answerText":"點一杯外帶飲料／咖啡。","audio":"audio/q24.m4a"},{"n":25,"type":"short","transcript":"W: I’m afraid I have some bad news. I can’t finish the report today. M: Oh, no! W: Yes, I’m afraid so. There’s nothing I can do. The computer isn’t working.","translation":"女：恐怕我有個壞消息。我今天無法完成報告。男：喔，不！女：是的，恐怕如此。我也沒辦法，電腦壞了。","q":"What is considered bad news by the woman?","zh":"女士所說的壞消息是什麼？","options":["She can’t finish her report on time. ✓ 正確答案：A","She’s to be fired by her boss.","Her computer is to be sold out.","Her computer is under repair."],"answer":0,"explanation":"電腦故障是原因；她首先把“不能完成報告”稱為bad news。","answerText":"她今天無法完成報告。","audio":"audio/q25.m4a"},{"n":26,"type":"short","transcript":"M: Are you ready to order? W: Yes, can you fix some ham and eggs? My plane’s boarding at 9:15. M: Sure, we can serve you in five minutes. You’ll have about 15 minutes to eat it.","translation":"男：您準備好點餐了嗎？女：是的，可以做一份火腿蛋嗎？我的飛機9:15開始登機。男：當然，我們5分鐘內可以上餐，您大約會有15分鐘可以吃。","q":"What time is it now?","zh":"現在幾點？","options":["8:55 ✓ 正確答案：A","9:00","9:05","9:10"],"answer":0,"explanation":"5分鐘後上餐，再有15分鐘用餐，合計20分鐘後是9:15，因此現在約8:55。","answerText":"約8:55。","audio":"audio/q26.m4a"},{"n":27,"type":"short","transcript":"M: Emily, what do you want to do after graduation? W: I’m not sure. As a student who majors in English, we have too many choices to choose. Maybe I will take studying graduate school into my consideration. Many of classmates are going to study graduate school, so I think I’ll also go to graduate. I want to be as same as others. M: Well, if you lose your direction, just ask your heart. What you really want to do right now. Don’t follow the trend. Follow your heart. You’ll find it.","translation":"男：Emily，畢業後你想做什麼？女：我不確定。身為英文系學生，我們有太多選擇。也許我會考慮念研究所。很多同學都要念研究所，所以我想我也會去。我想和其他人一樣。男：如果你迷失方向，就問問自己的內心，現在真正想做什麼。不要跟隨潮流，要跟隨自己的心，你會找到答案。","q":"Which one can use to describe Emily’s attitude?","zh":"哪一項可以用來形容Emily的態度？","options":["She’s very choosy.","She’s too aggressive.","She goes with the flow.","She’s a sceptic."],"answer":2,"explanation":"她說“I’m not sure”並因同學都念研究所而想跟著念。原檔無選項，故以語意作答。","answerText":"猶豫不決、缺乏明確方向，且傾向跟隨他人。","audio":"audio/q27.m4a"},{"n":28,"type":"short","transcript":"M: I dread the coming exams. If only I could have time to review my lessons. W: What was the matter with you? M: My mother was very ill; I had to attend to her. And I was worried about her operation.","translation":"男：我很害怕即將到來的考試。要是我有時間複習功課就好了。女：你怎麼了？男：我母親病得很重，我必須照顧她，而且我很擔心她的手術。","q":"Which statement is true?","zh":"下列哪一個敘述是正確的？","options":["The man didn’t pass his test.","The man didn’t attend to the test.","The man is worried about his tests.","The man can’t attend to the test."],"answer":2,"explanation":"原檔沒有選項；應選符合母親重病、他需照顧她且擔心手術的敘述。","answerText":"男士因照顧生病的母親而沒有足夠時間準備考試。","audio":"audio/q28.m4a"},{"n":29,"type":"short","transcript":"W: How many books are required for the class? M: Only two, but the instructor has suggested a lot of supplemental materials.","translation":"女：這門課規定要讀幾本書？男：只有兩本，不過老師建議了很多補充教材。","q":"What is the probable relation between the two speakers?","zh":"兩位說話者最可能是什麼關係？","options":["Professor and student.","Fellow students.","Fellow professors.","Librarian and student."],"answer":1,"explanation":"兩人在討論課程規定用書及教師建議的補充教材。","answerText":"很可能是學生／同學。","audio":"audio/q29.m4a"},{"n":30,"type":"short","transcript":"W: So, how was the movie? M: I wanted my dad to pay for the movie tickets, but he said I had to sing for my supper by cleaning the garage.","translation":"女：所以，電影怎麼樣？男：我本來想讓爸爸付電影票錢，但他說我要先清理車庫，才能得到這個好處。","q":"What did the man’s father want him to do?","zh":"男士的父親要他做什麼？","options":["Pay for the tickets.","Sing in the garage before dinner.","Get a free movie by cleaning garage.","Clean the garage before dinner."],"answer":2,"explanation":"“sing for my supper”意指必須付出勞力才能得到想要的東西；具體工作是cleaning the garage。","answerText":"清理車庫。","audio":"audio/q30.m4a"},{"n":31,"type":"long","transcript":"This is the VOA Special English Health Report. A new study suggests that the more teenagers watch television, the more likely they are to develop depression as young adults. But the extent to which TV may or may not be to blame is a question that the study leaves unanswered. The researchers used a national long-term survey of adolescent health to investigate the relationship between media use and depression. They based their findings on more than four thousand adolescents who were not depressed when the survey began in nineteen ninety-five. As part of the survey, the young people were asked how many hours of television or videos they watched daily. They were also asked how often they played computer games and listened to the radio. Media use totaled an average of five and one-half hours a day. More than two hours of that was spent watching TV. Seven years later, in two thousand two, more than seven percent of the young people had signs of depression. The average age at that time was twenty-one. Brian Primack at the University of Pittsburgh medical school was the lead author of the new study. He says every extra hour of television meant an eight percent increase in the chances of developing signs of depression. The researchers say they did not find any such relationship with the use of other media such as movies, video games or radio. But the study did find that young men were more likely than young women to develop depression given the same amount of media use. Doctor Primack says the study did not explore if watching TV causes depression. But one possibility, he says, is that it may take time away from activities that could help prevent depression, like sports and socializing. It might also interfere with sleep, he says, and that could have an influence. The study was just published in the Archives of General Psychiatry. In December, the journal Social Indicators Research published a study of activities that help lead to happy lives. Sociologists from the University of Maryland found that people who describe themselves as happy spend less time watching television than unhappy people. The study found that happy people are more likely to be socially active, to read, attend religious services and to vote.","translation":"這是VOA慢速英語健康報導。 一項新研究指出，青少年看電視的時間越長，成年初期出現憂鬱症狀的可能性越高。不過，電視究竟是否造成憂鬱，以及影響程度多大，這項研究並沒有得出答案。 研究人員利用一項全國性的青少年健康長期調查，研究媒體使用與憂鬱之間的關係。研究結果以4,000多名青少年為基礎；1995年調查開始時，這些人都沒有憂鬱症。 調查中，研究人員詢問年輕人每天看多少小時的電視或影片，也詢問他們玩電腦遊戲及聽廣播的頻率。 受訪者每天使用媒體平均共5.5小時，其中超過2小時用於看電視。 7年後，也就是2002年，超過7%的受訪年輕人出現憂鬱症狀，當時平均年齡為21歲。 匹茲堡大學醫學院的Brian Primack是這項研究的主要作者。他表示，每多看1小時電視，出現憂鬱症狀的機率就增加8%。 研究人員表示，電影、電玩或廣播等其他媒體並未發現相同關聯。但研究發現，在媒體使用量相同的情況下，年輕男性比年輕女性更可能出現憂鬱。 Primack醫師指出，這項研究並未探討看電視是否會造成憂鬱。不過，一種可能性是看電視會占用原本可從事運動、社交等有助預防憂鬱活動的時間，也可能干擾睡眠，進而造成影響。 研究刊登於《Archives of General Psychiatry》。另一項刊於《Social Indicators Research》的研究則發現，自認快樂的人比不快樂的人花較少時間看電視；快樂的人也較可能參與社交活動、閱讀、參加宗教活動及投票。","q":"What is the talk about?","zh":"這篇報導主要談什麼？","options":["The relationship between watching TV and depression. ✓ 正確答案：A","The relationship between age and depression.","The relationship between young people and activities.","The relationship between happy people and unhappy people."],"answer":0,"explanation":"青少年看電視的時間與日後出現憂鬱症狀之間的關係。","answerText":"青少年看電視的時間與日後出現憂鬱症狀之間的關係。","audio":"audio/long31-35.m4a","group":"31-35"},{"n":32,"type":"long","transcript":"This is the VOA Special English Health Report. A new study suggests that the more teenagers watch television, the more likely they are to develop depression as young adults. But the extent to which TV may or may not be to blame is a question that the study leaves unanswered. The researchers used a national long-term survey of adolescent health to investigate the relationship between media use and depression. They based their findings on more than four thousand adolescents who were not depressed when the survey began in nineteen ninety-five. As part of the survey, the young people were asked how many hours of television or videos they watched daily. They were also asked how often they played computer games and listened to the radio. Media use totaled an average of five and one-half hours a day. More than two hours of that was spent watching TV. Seven years later, in two thousand two, more than seven percent of the young people had signs of depression. The average age at that time was twenty-one. Brian Primack at the University of Pittsburgh medical school was the lead author of the new study. He says every extra hour of television meant an eight percent increase in the chances of developing signs of depression. The researchers say they did not find any such relationship with the use of other media such as movies, video games or radio. But the study did find that young men were more likely than young women to develop depression given the same amount of media use. Doctor Primack says the study did not explore if watching TV causes depression. But one possibility, he says, is that it may take time away from activities that could help prevent depression, like sports and socializing. It might also interfere with sleep, he says, and that could have an influence. The study was just published in the Archives of General Psychiatry. In December, the journal Social Indicators Research published a study of activities that help lead to happy lives. Sociologists from the University of Maryland found that people who describe themselves as happy spend less time watching television than unhappy people. The study found that happy people are more likely to be socially active, to read, attend religious services and to vote.","translation":"這是VOA慢速英語健康報導。 一項新研究指出，青少年看電視的時間越長，成年初期出現憂鬱症狀的可能性越高。不過，電視究竟是否造成憂鬱，以及影響程度多大，這項研究並沒有得出答案。 研究人員利用一項全國性的青少年健康長期調查，研究媒體使用與憂鬱之間的關係。研究結果以4,000多名青少年為基礎；1995年調查開始時，這些人都沒有憂鬱症。 調查中，研究人員詢問年輕人每天看多少小時的電視或影片，也詢問他們玩電腦遊戲及聽廣播的頻率。 受訪者每天使用媒體平均共5.5小時，其中超過2小時用於看電視。 7年後，也就是2002年，超過7%的受訪年輕人出現憂鬱症狀，當時平均年齡為21歲。 匹茲堡大學醫學院的Brian Primack是這項研究的主要作者。他表示，每多看1小時電視，出現憂鬱症狀的機率就增加8%。 研究人員表示，電影、電玩或廣播等其他媒體並未發現相同關聯。但研究發現，在媒體使用量相同的情況下，年輕男性比年輕女性更可能出現憂鬱。 Primack醫師指出，這項研究並未探討看電視是否會造成憂鬱。不過，一種可能性是看電視會占用原本可從事運動、社交等有助預防憂鬱活動的時間，也可能干擾睡眠，進而造成影響。 研究刊登於《Archives of General Psychiatry》。另一項刊於《Social Indicators Research》的研究則發現，自認快樂的人比不快樂的人花較少時間看電視；快樂的人也較可能參與社交活動、閱讀、參加宗教活動及投票。","q":"According to Brian Primack, what is the percentage of increase in the chances of developing signs of depression if every extra hour of television is added?","zh":"根據Brian Primack的說法，每多看1小時電視，出現憂鬱症狀的機率增加多少？","options":["Eighteen percent.","Eighty percent.","Eight percent.","Five percent."],"answer":2,"explanation":"8%。","answerText":"8%。","audio":"audio/long31-35.m4a","group":"31-35"},{"n":33,"type":"long","transcript":"This is the VOA Special English Health Report. A new study suggests that the more teenagers watch television, the more likely they are to develop depression as young adults. But the extent to which TV may or may not be to blame is a question that the study leaves unanswered. The researchers used a national long-term survey of adolescent health to investigate the relationship between media use and depression. They based their f he library. I have to hand in my biology paper tomorrow. M: Tomorrow? Oh, no. I thought it wasn’t due till Monday. W: Oh. Don’t worry. It is due Monday. But I’m going away for the weekend and won’t be back till Monday night. M: Oh, where are you going? W: California. We’re having a family reunion. It’s my grandmother’s ninetieth birthday. So all the cousins and aunts and uncles are going. She planned the whole thing herself. M: Wow. That’s great. How many people will be there? W: Around sixty. My family is big and spread out but we’re pretty close. So have you started working on your biology paper? M: Yeah. I’m doing it on bees and how they’re able to recognize whether another bee is related to them. W: How can they tell? M: They use their sense of smell. The honey bees guard their nests this way. If another bee approaches the nest, the guard determines if the new bee is familiar. If it is, it’s allowed to enter. W: Interesting. Can other insects do this? Well, the paper wasps can. Each wasp nest has a special combination of plant fibers and so the wasps that live there have a unique smell. Those two are the only kinds I’ve read about so far. M: Well, you’ve still got time. It sounds like the bees are picky about who comes to their family reunion.","translation":"男：嗨，Sue，你去哪裡了？女：嗨，Dan。我剛從圖書館回來。我明天得交生物報告。男：明天？糟了，我以為星期一才到期。女：別擔心，確實是星期一到期。但我週末要外出，直到星期一晚上才回來。男：你要去哪裡？女：加州。我們要舉行家庭聚會，慶祝祖母90歲生日，表兄弟姊妹、阿姨、叔叔都會去，而且整個活動是祖母自己安排的。男：哇，太棒了。會有多少人？女：約60人。我們家族很大、住得很分散，但彼此感情很好。 女：你的生物報告開始寫了嗎？男：有，我研究蜜蜂如何辨認另一隻蜜蜂是否與自己有親緣關係。女：牠們怎麼分辨？男：利用嗅覺。蜜蜂就是用這種方式守衛蜂巢。如果另一隻蜜蜂接近，守衛蜂會判斷牠的氣味是否熟悉；若熟悉就讓牠進去。女：其他昆蟲也能這樣嗎？男：紙蜂可以。每個蜂巢由特殊組合的植物纖維構成，因此住在裡面的蜂具有獨特氣味。目前我只讀到這兩種。最後兩人以「蜜蜂對參加牠們家庭聚會的對象很挑剔」開玩笑。","q":"What is the relationship between the speakers?","zh":"兩位說話者的關係是什麼？","options":["They’re classmates. ✓ 正確答案：A","They’re roommates.","They’re cousins.","They’re lab partners."],"answer":0,"explanation":"很可能是同學。兩人都在寫同一門生物課的報告。","answerText":"很可能是同學。兩人都在寫同一門生物課的報告。","audio":"audio/long36-40.m4a","group":"36-40"},{"n" make a wish.","translation":"男：前幾天我在公園散步時，看見一大片紅燈籠展示。你知道那是做什麼的嗎？女：那是元宵節慶祝活動的一部分。男：又一個節日？感覺農曆新年才剛結束。女：其實不完全是。元宵節正是象徵新年慶祝活動的結束。男：人們通常怎麼慶祝？女：傳統上，人們會放煙火、放天燈祈求好運。男：有意思！天燈是什麼？女：是一種小型紙燈籠。點火後會升上天空，你也可以許願。","q":"What is the giant display of red lanterns for?","zh":"大型紅燈籠展示是為了什麼？","options":["Celebration of the Chinese New Year.","Celebration of the Lantern Festival.","Celebration of the Dragon Boat Festival.","Celebration of the Moon Festival."],"answer":1,"explanation":"慶祝元宵節。","answerText":"慶祝元宵節。","audio":"audio/long41-45.m4a","group":"41-45"},{"n":43,"type":"long","transcript":"M: I was walking in the park the other day when I saw a giant display of red lanterns. Do you know what they’re for? W: They’re part of the Lantern Festival celebration. M: Another holiday? It seems like Chinese New Year just ended. W: Well, not exactly. The Lantern Festival actually marks the end of the New Year’s celebrations. M: How do people usually celebrate it? W: Traditionally, people set off fireworks and send off sky lanterns for good luck. M: Interesting! What are sky lanterns? W: They’re small paper lanterns. When you light them on fire, they rise up to the sky and you can make a wish.","translation":"男：前幾天我在公園散步時，看見一大片紅燈籠展示。你知道那是做什麼的嗎？女：那是元宵節慶祝活動的一部分。男：又一個節日？感覺農曆新年才剛結束。女：其實不完全是。元宵節正是象徵新年慶祝活動的結束。男：人們通常怎麼慶祝？女：傳統上，人們會放煙火、放天燈祈求好運。男：有意思！天燈是什麼？女：是一種小型紙燈籠。點火後會升上天空，你也可以許願。","q":"What does the Lantern Festival signify?","zh":"元宵節象徵什麼？","options":["The beginning of the Chinese New Year’s celebration.","The end of the Chinese New Year’s celebration.","Part of the New Year Eve’s celebration.","The most important celebration of the year."],"answer":1,"explanation":"象徵農曆新年慶祝活動的結束。","answerText":"象徵農曆新年慶祝活動的結束。","audio":"audio/long41-45.m4a","group":"41-45"},{"n":44,"type":"long","transcript":"M: I was walking in the park the other day when I saw a giant display of red lanterns. Do you know what they’re for? W: They’re part of the Lantern Festival celebration. M: Another holiday? It seems like Chines
